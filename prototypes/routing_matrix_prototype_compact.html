        return { ok: false, changed: false, action: "none" };
      }
      const currentlyCollapsed = isEntryCollapsedOnAxis(family, axis, entry);
      const nextCollapsed = !currentlyCollapsed;
      const changed = setEntryCollapsedOnAxis(family, axis, entry, nextCollapsed);
      return {
        ok: true,
        changed,
        action: nextCollapsed ? "collapse" : "expand",
      };
    }

    function entryFromToggleDataset(dataset) {
      if (!dataset) return null;
      const deviceName = String(dataset.deviceName || "").trim();
      const typeName = String(dataset.typeName || "").trim();
      if (dataset.deviceToggle) {
        return {
          kind: "device",
          device: deviceName,
        };
      }
      if (dataset.groupToggle) {
        return {
          kind: "group",
          device: deviceName,
          typeName,
        };
      }
      return null;
    }

    function setAxisCollapsed(entries, axis, collapsed) {
      const isDest = axis === "dest";
      const deviceSet = isDest ? collapsedDestDevices : collapsedSourceDevices;
      const groupSet = isDest ? collapsedDestGroups : collapsedSourceGroups;
      for (const entry of entries) {
        if (entry.kind === "device") {
          if (collapsed) deviceSet.add(entry.deviceKey);
          else deviceSet.delete(entry.deviceKey);
        } else if (entry.kind === "group") {
          if (collapsed) groupSet.add(entry.groupKey);
          else groupSet.delete(entry.groupKey);
        }
      }
    }

    function familyKeysForAutoCollapse() {
      const keys = new Set(FAMILY_ORDER);
      const defs = MODEL && typeof MODEL.families === "object" ? MODEL.families : {};
      for (const rawKey of Object.keys(defs)) {
        const fam = normalizeFamily(rawKey);
        if (fam) keys.add(fam);
      }
      return Array.from(keys).filter((fam) => fam && fam !== FAMILY_ALL);
    }

    function collapseGroupsForFamilyIfNeeded(family, sourcePortsOverride = null, destPortsOverride = null) {
      const fam = normalizeFamily(family);
      if (!fam || autoCollapsedFamilies.has(fam)) return;

      const sourcePorts = Array.isArray(sourcePortsOverride) ? sourcePortsOverride : portsForFamily(fam, true);
      const destPorts = Array.isArray(destPortsOverride) ? destPortsOverride : portsForFamily(fam, false);
      const sourceEntries = buildAxisEntries(fam, sourcePorts, "source", collapsedSourceGroups, collapsedSourceDevices);
      const destEntries = buildAxisEntries(fam, destPorts, "dest", collapsedDestGroups, collapsedDestDevices);

      for (const entry of sourceEntries) {
        if (entry?.kind === "group" && entry.groupKey) collapsedSourceGroups.add(entry.groupKey);
      }
      for (const entry of destEntries) {
        if (entry?.kind === "group" && entry.groupKey) collapsedDestGroups.add(entry.groupKey);
      }
      autoCollapsedFamilies.add(fam);
    }

    function collapseDevicesForFamilyIfNeeded(family, sourcePortsOverride = null, destPortsOverride = null) {
      const fam = normalizeFamily(family);
      if (!fam || autoCollapsedDeviceFamilies.has(fam)) return;

      const sourcePorts = Array.isArray(sourcePortsOverride) ? sourcePortsOverride : portsForFamily(fam, true);
      const destPorts = Array.isArray(destPortsOverride) ? destPortsOverride : portsForFamily(fam, false);
      const sourceDevices = new Set(sourcePorts.map((port) => String(port?.device || "").trim()).filter(Boolean));
      const destDevices = new Set(destPorts.map((port) => String(port?.device || "").trim()).filter(Boolean));

      for (const device of sourceDevices) {
        collapsedSourceDevices.add(buildDeviceKey(fam, "source", device));
      }
      for (const device of destDevices) {
        collapsedDestDevices.add(buildDeviceKey(fam, "dest", device));
      }
      autoCollapsedDeviceFamilies.add(fam);
    }

    function ensureAutoCollapsedForFamily(family, sourcePortsOverride = null, destPortsOverride = null) {
      const fam = String(family || "");
      collapseGroupsForFamilyIfNeeded(fam, sourcePortsOverride, destPortsOverride);
    }

    function axisToggleMeta(family, axis, entries) {
      const noun = axis === "dest" ? "destination" : "source";
      const togglable = (Array.isArray(entries) ? entries : []).filter((entry) => entry && (entry.kind === "device" || entry.kind === "group"));
      if (!togglable.length) {
        return {
          enabled: false,
          action: "none",
          label: "−",
          title: `No ${noun} folders available.`,
        };
      }
      let collapsedCount = 0;
      for (const entry of togglable) {
        if (isEntryCollapsedOnAxis(family, axis, entry)) collapsedCount += 1;
      }
      const allCollapsed = collapsedCount === togglable.length;
      const action = allCollapsed ? "expand" : "collapse";
      return {
        enabled: true,
        action,
        label: action === "expand" ? "+" : "−",
        title: `${action === "expand" ? "Expand" : "Collapse"} ${noun} folders`,
      };
    }

    function renderMatrix() {
      const renderStartedAt = performance.now();
      const viewportState = captureMatrixViewportState();
      const focusState = captureMatrixFocusState();
      if (tooltip) tooltip.style.display = "none";
      const prevMatrixVisibility = matrixContainer ? String(matrixContainer.style.visibility || "") : "";
      if (matrixContainer) matrixContainer.style.visibility = "hidden";
      const family = String(familySelect.value || "AUDIO");
      const sourcePorts = portsForFamily(family, true);
      const destPorts = portsForFamily(family, false);
      if (family === FAMILY_ALL) {
        collapseDevicesForFamilyIfNeeded(family, sourcePorts, destPorts);
      }
      ensureAutoCollapsedForFamily(family, sourcePorts, destPorts);
      const sourceEntries = buildAxisEntries(family, sourcePorts, "source", collapsedSourceGroups, collapsedSourceDevices);
      const destEntries = buildAxisEntries(family, destPorts, "dest", collapsedDestGroups, collapsedDestDevices);

      const visibleSources = sourceEntries.filter((entry) => isEntryVisible(entry, sourceFilter));
      const visibleDests = destEntries.filter((entry) => isEntryVisible(entry, destFilter));
      const sourceLeafEntries = visibleSources.filter((entry) => entry.kind === "port");
      const destLeafEntries = visibleDests.filter((entry) => entry.kind === "port");
      const sourceLeafIndexByKey = new Map(
        sourceLeafEntries.map((entry, idx) => [connectionKey(entry.port.device, entry.port.port, "", ""), idx])
      );
      const destLeafIndexByKey = new Map(
        destLeafEntries.map((entry, idx) => [connectionKey("", "", entry.port.device, entry.port.port), idx])
      );
      const sourceVisibleIndexByKey = new Map();
      for (let idx = 0; idx < visibleSources.length; idx += 1) {
        const entry = visibleSources[idx];
        if (entry.kind !== "port") continue;
        sourceVisibleIndexByKey.set(connectionKey(entry.port.device, entry.port.port, "", ""), idx);
      }
      const destVisibleIndexByKey = new Map();
      for (let idx = 0; idx < visibleDests.length; idx += 1) {
        const entry = visibleDests[idx];
        if (entry.kind !== "port") continue;
        destVisibleIndexByKey.set(connectionKey("", "", entry.port.device, entry.port.port), idx);
      }

      const sourceLeafCount = visibleSources.filter((entry) => entry.kind === "port").length;
      const destLeafCount = visibleDests.filter((entry) => entry.kind === "port").length;
      const sourceAxisToggle = axisToggleMeta(family, "source", sourceEntries);
      const destAxisToggle = axisToggleMeta(family, "dest", destEntries);

      if (!visibleSources.length || !visibleDests.length) {
        matrixContainer.innerHTML = `<div style=\"padding:12px;color:var(--empty-ink);\">No entries to show for ${family}. Adjust filters or expand devices.</div>`;
        setStatus(`No entries to show for ${family}.`, true);
        restoreMatrixViewportState(viewportState);
        if (matrixContainer) matrixContainer.style.visibility = prevMatrixVisibility;
        finishMatrixRender(renderStartedAt, 0);
        return;
      }

      const familyConnectionByKey = new Map();
      for (const row of connections) {
        if (family !== FAMILY_ALL && row.family !== family) continue;
        familyConnectionByKey.set(connectionKey(row.source_device, row.source_port, row.dest_device, row.dest_port), row);
      }
      const familyConnectionKeys = new Set(familyConnectionByKey.keys());
      matrixContainer.style.padding = "0";
      matrixContainer.style.color = "";
      matrixContainer.style.position = "relative";

      let html = `<table aria-label="${escAttr(family)} routing matrix" aria-describedby="matrixKeyboardHelp"><thead><tr>`;
      html += "<th class=\"top-left sticky-top sticky-left\"><div class=\"tl-box\">";
      html += "<div class=\"mini tl-axis-metrics\">";
      html += `<span class=\"axis-metric\">Transmitters: ${sourceLeafCount}<button class=\"icon-btn\" id=\"toggleSourceTopBtn\" data-matrix-focus-key=\"header:source:all\" type=\"button\" title=\"${escAttr(sourceAxisToggle.title)}\" aria-label=\"${escAttr(sourceAxisToggle.title)}\" aria-expanded=\"${sourceAxisToggle.action === "collapse" ? "true" : "false"}\"${sourceAxisToggle.enabled ? "" : " disabled"}>${escHtml(sourceAxisToggle.label)}</button></span>`;
      html += `<span class=\"axis-metric\">Receivers: ${destLeafCount}<button class=\"icon-btn\" id=\"toggleDestTopBtn\" data-matrix-focus-key=\"header:dest:all\" type=\"button\" title=\"${escAttr(destAxisToggle.title)}\" aria-label=\"${escAttr(destAxisToggle.title)}\" aria-expanded=\"${destAxisToggle.action === "collapse" ? "true" : "false"}\"${destAxisToggle.enabled ? "" : " disabled"}>${escHtml(destAxisToggle.label)}</button></span>`;
      html += "</div>";
      html += "</div></th>";

      for (let d = 0; d < visibleDests.length; d += 1) {
        const entry = visibleDests[d];
        const classes = ["dest-col-head", "sticky-top"];
        let nameClass = "port";
        let entryName = "";
        let entryCount = "";
        let toggle = "";
        if (entry.kind === "device") {
          classes.push("dest-kind-device");
          nameClass = "device";
          entryName = `${entry.device}`;
          entryCount = `${entry.memberCount}`;
          const toggleMeta = toggleMetaForEntry(entry);
          toggle = `<button class=\"icon-btn\" data-device-toggle=\"1\" data-axis=\"dest\" data-device=\"${escAttr(entry.deviceKey)}\" data-device-name=\"${escAttr(entry.device)}\" data-matrix-focus-key=\"header:dest:${escAttr(matrixEntryFocusIdentity(entry))}\" type=\"button\" title=\"${escAttr(toggleMeta.title)}\" aria-label=\"${escAttr(`${toggleMeta.title}: ${entry.device}`)}\" aria-expanded=\"${toggleMeta.collapsed ? "false" : "true"}\">${toggleMeta.symbol}</button>`;
        } else if (entry.kind === "group") {
          classes.push("dest-kind-group");
          nameClass = "group";
          entryName = `${entry.typeName}`;
          entryCount = `${entry.memberCount}`;
          const toggleMeta = toggleMetaForEntry(entry);
          toggle = `<button class=\"icon-btn\" data-group-toggle=\"1\" data-axis=\"dest\" data-group=\"${escAttr(entry.groupKey)}\" data-device-name=\"${escAttr(entry.device)}\" data-type-name=\"${escAttr(entry.typeName)}\" data-matrix-focus-key=\"header:dest:${escAttr(matrixEntryFocusIdentity(entry))}\" type=\"button\" title=\"${escAttr(toggleMeta.title)}\" aria-label=\"${escAttr(`${toggleMeta.title}: ${entry.device} ${entry.typeName}`)}\" aria-expanded=\"${toggleMeta.collapsed ? "false" : "true"}\">${toggleMeta.symbol}</button>`;
        } else {
          classes.push("dest-kind-port");
          nameClass = "port";
          entryName = entry.port.port;
        }
        const iconHtml = entry.kind === "port"
          ? `<span class="dest-icon-wrap">${iconHtmlForPort(entry.port)}</span>`
          : "";
        const nameHtml = escHtml(entryName);
        const countHtml = entryCount ? `<span class="dest-count">${escHtml(entryCount)}</span>` : "";
        const titleText = entry.kind === "port"
          ? `${entry.device} ${entryName}`
          : `${entry.device} ${entryName} ${entryCount}`.trim();
        const lineClass = entry.kind === "port" ? "dest-head-line port" : "dest-head-line folder";
        const innerClass = entry.kind === "port" ? "dest-col-inner port" : "dest-col-inner folder";
        html += `<th class=\"${classes.join(" ")}\" scope=\"col\"><div class=\"${innerClass}\">${toggle}<div class=\"${lineClass}\">${iconHtml}<span class=\"dest-name ${nameClass}\" title=\"${escAttr(titleText)}\">${nameHtml}</span>${countHtml}</div></div></th>`;
      }
      html += "</tr></thead><tbody>";

      for (let s = 0; s < visibleSources.length; s += 1) {
        const source = visibleSources[s];
        let rowName = "";
        let rowClass = "port";
        const sourceHeadClasses = ["source-head", "sticky-left"];
        let toggle = "";
        let countText = "";
        if (source.kind === "device") {
          rowName = source.device;
          rowClass = "device";
          sourceHeadClasses.push("source-kind-device");
          countText = `${source.memberCount} ports`;
          const toggleMeta = toggleMetaForEntry(source);
          toggle = `<button class=\"icon-btn\" data-device-toggle=\"1\" data-axis=\"source\" data-device=\"${escAttr(source.deviceKey)}\" data-device-name=\"${escAttr(source.device)}\" data-matrix-focus-key=\"header:source:${escAttr(matrixEntryFocusIdentity(source))}\" type=\"button\" title=\"${escAttr(toggleMeta.title)}\" aria-label=\"${escAttr(`${toggleMeta.title}: ${source.device}`)}\" aria-expanded=\"${toggleMeta.collapsed ? "false" : "true"}\">${toggleMeta.symbol}</button>`;
        } else if (source.kind === "group") {
          rowName = source.typeName;
          rowClass = "group";
          sourceHeadClasses.push("source-kind-group");
          countText = `${source.memberCount}`;
          const toggleMeta = toggleMetaForEntry(source);
          toggle = `<button class=\"icon-btn\" data-group-toggle=\"1\" data-axis=\"source\" data-group=\"${escAttr(source.groupKey)}\" data-device-name=\"${escAttr(source.device)}\" data-type-name=\"${escAttr(source.typeName)}\" data-matrix-focus-key=\"header:source:${escAttr(matrixEntryFocusIdentity(source))}\" type=\"button\" title=\"${escAttr(toggleMeta.title)}\" aria-label=\"${escAttr(`${toggleMeta.title}: ${source.device} ${source.typeName}`)}\" aria-expanded=\"${toggleMeta.collapsed ? "false" : "true"}\">${toggleMeta.symbol}</button>`;
        } else {
          rowName = `<span class="port-with-icon">${iconHtmlForPort(source.port)}<span class="text">${escHtml(source.port.port)}</span></span>`;
          rowClass = "port";
          sourceHeadClasses.push("source-kind-port");
        }

        html += "<tr>";
        if (source.kind === "port") {
          html += `<th class=\"${sourceHeadClasses.join(" ")}\" scope=\"row\"><div class=\"source-line\">${toggle}<span class=\"name ${rowClass}\" title=\"${escAttr(source.device + ' ' + source.port.port)}\">${rowName}</span>${countText ? `<span class=\"count\">${escHtml(countText)}</span>` : ""}</div></th>`;
        } else {
          html += `<th class=\"${sourceHeadClasses.join(" ")}\" scope=\"row\"><div class=\"source-line\">${toggle}<span class=\"name ${rowClass}\" title=\"${escAttr(source.device + ' ' + rowName)}\">${escHtml(rowName)}</span>${countText ? `<span class=\"count\">${escHtml(countText)}</span>` : ""}</div></th>`;
        }

        for (let d = 0; d < visibleDests.length; d += 1) {
          const dest = visibleDests[d];
          const editable = source.kind === "port" && dest.kind === "port";
          const cellFocusKey = matrixCellFocusKey(source, dest);
          const sourceLabel = formatEntryLabel(source);
          const destLabel = formatEntryLabel(dest);
          if (!editable) {
            const cls = ["cell", "groupcell"];
            const hasDeviceAxis = source.kind === "device" || dest.kind === "device";
            const hasGroupAxis = source.kind === "group" || dest.kind === "group";
            if (hasDeviceAxis) cls.push("axis-device");
            else if (hasGroupAxis) cls.push("axis-group");
            else cls.push("axis-base");
            const meta = folderCellToggleMeta(family, source, dest);
            if (meta.sourceFolder) cls.push("folder-source");
            if (meta.destFolder) cls.push("folder-dest");
            if (meta.sourceFolder && meta.destFolder) cls.push("folder-junction");
            if (!meta.canToggle) cls.push("disabled");
            const folderLabel = meta.canToggle
              ? `${meta.hover} Source ${sourceLabel}; destination ${destLabel}.`
              : `Source ${sourceLabel}; destination ${destLabel}. No folder action available.`;
            const expandedState = meta.canToggle ? ` aria-expanded=\"${meta.action === "collapse" ? "true" : "false"}\"` : "";
            html += `<td class=\"${cls.join(" ")}\" data-si=\"${s}\" data-di=\"${d}\" data-folder-toggle=\"${escAttr(meta.action)}\" data-hover=\"${escAttr(meta.hover)}\"><button class=\"matrix-cell-control\" type=\"button\" role=\"button\" tabindex=\"-1\" data-matrix-focus-cell=\"1\" data-matrix-focus-key=\"${escAttr(cellFocusKey)}\" data-si=\"${s}\" data-di=\"${d}\" aria-label=\"${escAttr(folderLabel)}\"${meta.canToggle ? "" : " aria-disabled=\"true\" disabled"}${expandedState}>${escHtml(meta.symbol)}</button></td>`;
            continue;
          }

          const src = source.port;
          const dst = dest.port;
          const key = connectionKey(src.device, src.port, dst.device, dst.port);
          const connection = familyConnectionByKey.get(key) || null;
          const presentation = crosspointPresentation(family, src, dst, connection);
          const connected = presentation.connected;
          const enabled = presentation.enabled;
          const linkFamily = presentation.compatibility.family;
          const cls = ["cell"];
          if (enabled) cls.push("editable");
          if (!enabled) cls.push("disabled");
          if (connected) cls.push("on");
          if (!connected && !linkFamily) cls.push("incompatible");
          const crosspointLabel = `${sourceLabel} to ${destLabel}. ${presentation.connectionState}`;
          const text = "";
          html += `<td class=\"${cls.join(" ")}\" data-si=\"${s}\" data-di=\"${d}\" data-hover=\"${escAttr(presentation.title)}\"><button class=\"matrix-cell-control\" type=\"button\" role=\"checkbox\" tabindex=\"-1\" data-matrix-focus-cell=\"1\" data-matrix-focus-key=\"${escAttr(cellFocusKey)}\" data-si=\"${s}\" data-di=\"${d}\" aria-label=\"${escAttr(crosspointLabel)}\" aria-checked=\"${connected ? "true" : "false"}\"${enabled ? "" : " aria-disabled=\"true\" disabled"}>${text}</button></td>`;
        }

        html += "</tr>";
      }

      html += "</tbody></table>";
      matrixContainer.innerHTML = html;

      const toggleSourceTopBtn = document.getElementById("toggleSourceTopBtn");
      const toggleDestTopBtn = document.getElementById("toggleDestTopBtn");

      if (toggleSourceTopBtn) toggleSourceTopBtn.onclick = () => {
        if (!sourceAxisToggle.enabled || sourceAxisToggle.action === "none") {
          setStatus("No source folders available for toggle.", true);
          return;
        }
        const collapse = sourceAxisToggle.action === "collapse";
        setAxisCollapsed(sourceEntries, "source", collapse);
        setStatus(`${collapse ? "Collapsed" : "Expanded"} source folders.`);
        scheduleRender(true);
      };
      if (toggleDestTopBtn) toggleDestTopBtn.onclick = () => {
        if (!destAxisToggle.enabled || destAxisToggle.action === "none") {
          setStatus("No destination folders available for toggle.", true);
          return;
        }
        const collapse = destAxisToggle.action === "collapse";
        setAxisCollapsed(destEntries, "dest", collapse);
        setStatus(`${collapse ? "Collapsed" : "Expanded"} destination folders.`);
        scheduleRender(true);
      };

      const table = matrixContainer.querySelector("table");
      if (!table) {
        restoreMatrixViewportState(viewportState);
        if (matrixContainer) matrixContainer.style.visibility = prevMatrixVisibility;
        finishMatrixRender(renderStartedAt, 0);
        return;
      }

      function resolveEditableCellContext(cell) {
        if (!(cell instanceof HTMLTableCellElement)) {
          return { ok: false, error: "No editable patch point selected." };
        }
        const si = Number(cell.dataset.si);
        const di = Number(cell.dataset.di);
        const srcEntry = visibleSources[si];
        const dstEntry = visibleDests[di];
        if (!srcEntry || !dstEntry || srcEntry.kind !== "port" || dstEntry.kind !== "port") {
          return { ok: false, error: "No editable patch point selected." };
        }
        const src = srcEntry.port;
        const dst = dstEntry.port;
        const srcIdx = sourceLeafIndexByKey.get(connectionKey(src.device, src.port, "", ""));
        const dstIdx = destLeafIndexByKey.get(connectionKey("", "", dst.device, dst.port));
        if (!Number.isInteger(srcIdx) || !Number.isInteger(dstIdx)) {
          return { ok: false, error: "Could not resolve patch indices for selected cell." };
        }
        return { ok: true, si, di, src, dst, srcIdx, dstIdx };
      }

      function resolvePaintContextByLeafIndex(srcIdx, dstIdx) {
        if (!Number.isInteger(srcIdx) || !Number.isInteger(dstIdx)) return null;
        const srcEntry = sourceLeafEntries[srcIdx];
        const dstEntry = destLeafEntries[dstIdx];
        if (!srcEntry || !dstEntry || srcEntry.kind !== "port" || dstEntry.kind !== "port") {
          return null;
        }
        const src = srcEntry.port;
        const dst = dstEntry.port;
        const si = sourceVisibleIndexByKey.get(connectionKey(src.device, src.port, "", ""));
        const di = destVisibleIndexByKey.get(connectionKey("", "", dst.device, dst.port));
        if (!Number.isInteger(si) || !Number.isInteger(di)) return null;
        return { ok: true, si, di, src, dst, srcIdx, dstIdx };
      }

      function collectPaintDiagonalContexts(anchorContext, targetContext) {
        if (!anchorContext || !anchorContext.ok || !targetContext || !targetContext.ok) return [];
        const srcDelta = targetContext.srcIdx - anchorContext.srcIdx;
        const dstDelta = targetContext.dstIdx - anchorContext.dstIdx;
        const srcStep = srcDelta === 0 ? 0 : (srcDelta > 0 ? 1 : -1);
        const dstStep = dstDelta === 0 ? 0 : (dstDelta > 0 ? 1 : -1);
        const span = Math.min(Math.abs(srcDelta), Math.abs(dstDelta));

        const contexts = [];
        for (let offset = 0; offset <= span; offset += 1) {
          const context = resolvePaintContextByLeafIndex(
            anchorContext.srcIdx + (offset * srcStep),
            anchorContext.dstIdx + (offset * dstStep)
          );
          if (context) contexts.push(context);
        }
        return contexts;
      }

      function connectionIndexForPair(sourcePort, destPort) {
        const key = connectionKey(sourcePort.device, sourcePort.port, destPort.device, destPort.port);
        if (!familyConnectionKeys.has(key)) return -1;
        const idx = findConnectionIndex(family, sourcePort.device, sourcePort.port, destPort.device, destPort.port);
        if (idx < 0) familyConnectionKeys.delete(key);
        return idx;
      }

      function applyPatchRangeFromStart(sourceIndex, destIndex, action, span) {
        let changed = 0;
        let skipped = 0;
        let firstError = "";
        const changedPairs = [];
        for (let offset = 0; offset < span; offset += 1) {
          const srcLeaf = sourceLeafEntries[sourceIndex + offset];
          const dstLeaf = destLeafEntries[destIndex + offset];
          if (!srcLeaf || !dstLeaf) {
            skipped += 1;
            if (!firstError) firstError = "Patch range exceeded available aligned ports.";
            continue;
          }
          const sPort = srcLeaf.port;
          const dPort = dstLeaf.port;

          const key = connectionKey(sPort.device, sPort.port, dPort.device, dPort.port);
          let idx = -1;
          if (familyConnectionKeys.has(key)) {
            idx = findConnectionIndex(family, sPort.device, sPort.port, dPort.device, dPort.port);
            if (idx < 0) familyConnectionKeys.delete(key);
          }

          if (action === "disconnect") {
            if (idx >= 0) {
              const removedRow = connections[idx];
              unindexConnectionRow(removedRow);
              connections.splice(idx, 1);
              const remainingRow = connectionRowForPair(family, sPort.device, sPort.port, dPort.device, dPort.port);
              if (remainingRow) {
                familyConnectionKeys.add(key);
                familyConnectionByKey.set(key, remainingRow);
              } else {
                familyConnectionKeys.delete(key);
                familyConnectionByKey.delete(key);
              }
              changed += 1;
              changedPairs.push({ key, sourcePort: sPort, destPort: dPort });
            }
            continue;
          }

          const linkFamily = resolveLinkFamily(family, sPort, dPort);
          if (!sPort.enabled || !dPort.enabled) {
            skipped += 1;
            if (!firstError) firstError = `Disabled port in selection: ${sPort.device} [${sPort.port}] -> ${dPort.device} [${dPort.port}]`;
            continue;
          }
          if (!linkFamily) {
            skipped += 1;
            if (!firstError) {
              const reason = linkCompatibilityReason(family, sPort, dPort) || "Unavailable connection";
              firstError = `${reason}: ${sPort.device} [${sPort.port}] -> ${dPort.device} [${dPort.port}]`;
            }
            continue;
          }

          if (idx >= 0) continue;
          const conflict = findStrictConflict(sPort.device, sPort.port, dPort.device, dPort.port, key);
          if (!allowDoublePatchingEnabled() && conflict) {
            skipped += 1;
            if (!firstError) {
              firstError = `Double patching blocked: ${sPort.device} [${sPort.port}] or ${dPort.device} [${dPort.port}] already used by ${String(conflict.cable_id || "(auto)")}. Enable "Allow Double Patching" to allow.`;
            }
            continue;
          }
          const newConnection = {
            cable_id: nextCableId(cableIdAllocator, linkFamily),
            family: linkFamily,
            source_device: sPort.device,
            source_port: sPort.port,
            dest_device: dPort.device,
            dest_port: dPort.port,
            connection_type: resolveConnectionTag(linkFamily),
            status: "Connected",
            notes: "",
            override_1to1: Boolean(conflict),
          };
          connections.push(newConnection);
          indexConnectionRow(newConnection);
          familyConnectionKeys.add(key);
          familyConnectionByKey.set(key, newConnection);
          changed += 1;
          changedPairs.push({ key, sourcePort: sPort, destPort: dPort });
        }
        return { changed, skipped, firstError, changedPairs };
      }

      function applyPatchFromCell(cell, forcedAction = "", forcedSpan = patchSpan()) {
        const context = resolveEditableCellContext(cell);
        if (!context.ok) {
          return {
            changed: 0,
            skipped: 0,
            firstError: context.error || "No editable patch point selected.",
            changedPairs: [],
            action: "",
            context: null,
          };
        }
        const action = forcedAction || (connectionIndexForPair(context.src, context.dst) >= 0 ? "disconnect" : "connect");
        const span = Math.max(1, Number(forcedSpan || 1));
        const result = applyPatchRangeFromStart(context.srcIdx, context.dstIdx, action, span);
        return { ...result, action, context };
      }

      let hoveredPointCell = null;
      let hoveredRowIndex = -1;
      let hoveredColIndex = -1;
      let lastHoverKey = "";
      let hoverFrame = 0;
      let pendingHover = null;

      function clearHoveredRow() {
        if (!Number.isInteger(hoveredRowIndex) || hoveredRowIndex < 0) {
          hoveredRowIndex = -1;
          return;
        }
        const row = table.rows[hoveredRowIndex];
        if (row) {
          for (const rowCell of Array.from(row.cells)) {
            rowCell.classList.remove("axis-hover-row");
          }
        }
        hoveredRowIndex = -1;
      }

      function clearHoveredCol() {
        if (!Number.isInteger(hoveredColIndex) || hoveredColIndex < 0) {
          hoveredColIndex = -1;
          return;
        }
        for (const rowEntry of Array.from(table.rows)) {
          const colCell = rowEntry.cells[hoveredColIndex];
          if (colCell instanceof HTMLTableCellElement) {
            colCell.classList.remove("axis-hover-col");
          }
        }
        hoveredColIndex = -1;
      }

      function clearAxisHover() {
        clearHoveredRow();
        clearHoveredCol();
        if (hoveredPointCell instanceof HTMLTableCellElement) {
          hoveredPointCell.classList.remove("axis-hover-point");
          hoveredPointCell = null;
        }
      }

      function applyAxisHover(cell) {
        const row = cell.parentElement instanceof HTMLTableRowElement ? cell.parentElement : null;
        if (!row) {
          clearAxisHover();
          return;
        }
        const rowIndex = Number(row.rowIndex || -1);
        const colIndex = Number(cell.cellIndex || -1);
        if (rowIndex < 0 || colIndex < 0) {
          clearAxisHover();
          return;
        }

        if (rowIndex !== hoveredRowIndex) {
          clearHoveredRow();
          const rowCells = Array.from(row.cells);
          for (const rowCell of rowCells) {
            rowCell.classList.add("axis-hover-row");
          }
          hoveredRowIndex = rowIndex;
        }

        if (colIndex !== hoveredColIndex) {
          clearHoveredCol();
          for (const rowEntry of Array.from(table.rows)) {
            const colCell = rowEntry.cells[colIndex];
            if (colCell instanceof HTMLTableCellElement) {
              colCell.classList.add("axis-hover-col");
            }
          }
          hoveredColIndex = colIndex;
        }

        if (hoveredPointCell !== cell) {
          if (hoveredPointCell instanceof HTMLTableCellElement) {
            hoveredPointCell.classList.remove("axis-hover-point");
          }
          hoveredPointCell = cell;
          hoveredPointCell.classList.add("axis-hover-point");
        }
      }

      function applyPendingHover() {
        hoverFrame = 0;
        const payload = pendingHover;
        pendingHover = null;
        if (!payload) return;
        const cell = payload.cell;
        if (!(cell instanceof HTMLTableCellElement) || !table.contains(cell)) {
          clearAxisHover();
          lastHoverKey = "";
          tooltip.style.display = "none";
          return;
        }
        const hoverKey = `${cell.dataset.si || ""}:${cell.dataset.di || ""}`;
        if (hoverKey !== lastHoverKey) {
          applyAxisHover(cell);
          lastHoverKey = hoverKey;
          const si = Number(cell.dataset.si);
          const di = Number(cell.dataset.di);
          const src = visibleSources[si];
          const dst = visibleDests[di];
          const title = src && dst
            ? `${formatEntryLabel(src)} -> ${formatEntryLabel(dst)}`
            : "Patch point";
          const detail = String(cell.dataset.hover || "");
          tooltip.textContent = `${title}\n${detail}`;
        }
        tooltip.style.display = "block";
        tooltip.style.left = `${payload.clientX + 10}px`;
        tooltip.style.top = `${payload.clientY + 10}px`;
      }

      function matrixCellByIndices(si, di) {
        if (!Number.isInteger(si) || !Number.isInteger(di)) return null;
        const row = table.rows[si + 1];
        if (!(row instanceof HTMLTableRowElement)) return null;
        const cell = row.cells[di + 1];
        return (cell instanceof HTMLTableCellElement) ? cell : null;
      }

      function syncChangedPatchCells(result) {
        const changedPairs = Array.isArray(result?.changedPairs) ? result.changedPairs : [];
        if (!changedPairs.length) return false;
        let updated = 0;
        for (const pair of changedPairs) {
          const sourcePort = pair?.sourcePort;
          const destPort = pair?.destPort;
          if (!sourcePort || !destPort) continue;
          const si = sourceVisibleIndexByKey.get(connectionKey(sourcePort.device, sourcePort.port, "", ""));
          const di = destVisibleIndexByKey.get(connectionKey("", "", destPort.device, destPort.port));
          const cell = matrixCellByIndices(si, di);
          if (!(cell instanceof HTMLTableCellElement)) continue;
          const connection = connectionRowForPair(
            family,
            sourcePort.device,
            sourcePort.port,
            destPort.device,
            destPort.port
          );
          const presentation = crosspointPresentation(family, sourcePort, destPort, connection);
          const control = cell.querySelector(".matrix-cell-control");
          cell.classList.toggle("on", presentation.connected);
          control?.setAttribute("aria-checked", presentation.connected ? "true" : "false");
          control?.setAttribute(
            "aria-label",
            `${formatEntryLabel({ kind: "port", port: sourcePort })} to ${formatEntryLabel({ kind: "port", port: destPort })}. ${presentation.connectionState}`
          );
          cell.dataset.hover = presentation.title;
          updated += 1;
        }
        matrixPerfCounters.localCellUpdates += updated;
        return updated === changedPairs.length;
      }

      table.onmousemove = (event) => {
        const cell = eventClosest(event, "td.cell");
        pendingHover = {
          cell: (cell && table.contains(cell)) ? cell : null,
          clientX: Number(event.clientX || 0),
          clientY: Number(event.clientY || 0),
        };
        if (hoverFrame) return;
        hoverFrame = window.requestAnimationFrame(applyPendingHover);
      };

      table.onmouseleave = () => {
        pendingHover = null;
        if (hoverFrame) {
          window.cancelAnimationFrame(hoverFrame);
          hoverFrame = 0;
        }
        clearAxisHover();
        lastHoverKey = "";
        tooltip.style.display = "none";
      };

      let paintSession = null;

      function endPaintSession() {
        window.removeEventListener("mouseup", endPaintSession, true);
        window.removeEventListener("blur", endPaintSession);
        if (!paintSession) return;
        const session = paintSession;
        paintSession = null;
        if (session.changed > 0) {
          if (session.action === "connect") {
            setStatus(`Connected ${session.changed} link(s) in paint mode${session.skipped > 0 ? ` (${session.skipped} skipped)` : ""}.`);
          } else {
            setStatus(`Disconnected ${session.changed} link(s) in paint mode${session.skipped > 0 ? ` (${session.skipped} skipped)` : ""}.`);
          }
          recordPatchHistory(`${session.action === "connect" ? "Paint connect" : "Paint disconnect"} ${session.changed} link(s)`);
          queuePatchAutoSave(session.action === "connect" ? "paint-connect" : "paint-disconnect");
          if (!syncChangedPatchCells({ changedPairs: session.changedPairs })) scheduleRender();
          return;
        }
        setStatus(session.firstError || "No changes.", true);
      }

      function paintCell(cell) {
        if (!paintSession) return;
        if (!(cell instanceof HTMLTableCellElement) || !table.contains(cell)) return;
        const targetContext = resolveEditableCellContext(cell);
        if (!targetContext.ok) {
          paintSession.skipped += 1;
          if (!paintSession.firstError) {
            paintSession.firstError = targetContext.error || "No editable patch point selected.";
          }
          return;
        }
        const contexts = collectPaintDiagonalContexts(paintSession.anchor, targetContext);
        if (!contexts.length) {
          paintSession.skipped += 1;
          if (!paintSession.firstError) {
            paintSession.firstError = "Could not resolve diagonal paint path.";
          }
          return;
        }
        for (const context of contexts) {
          const cellKey = `${context.srcIdx}:${context.dstIdx}`;
          if (paintSession.visited.has(cellKey)) continue;
          paintSession.visited.add(cellKey);
          const result = applyPatchRangeFromStart(context.srcIdx, context.dstIdx, paintSession.action, 1);
          paintSession.changed += result.changed;
          paintSession.skipped += result.skipped;
          if (Array.isArray(result.changedPairs)) paintSession.changedPairs.push(...result.changedPairs);
          if (!paintSession.firstError && result.firstError) paintSession.firstError = result.firstError;
          if (result.changed <= 0) continue;
          const paintCellEl = matrixCellByIndices(context.si, context.di);
          if (!(paintCellEl instanceof HTMLTableCellElement)) continue;
          const isConnected = paintSession.action === "connect";
          const paintControl = paintCellEl.querySelector(".matrix-cell-control");
          paintCellEl.classList.toggle("on", isConnected);
          paintControl?.setAttribute("aria-checked", isConnected ? "true" : "false");
          const srcPortName = String(context?.src?.port || "");
          const dstPortName = String(context?.dst?.port || "");
          if (!srcPortName || !dstPortName) continue;
          paintCellEl.dataset.hover = isConnected
            ? `Paint connect: ${srcPortName} -> ${dstPortName}`
            : `Paint disconnect: ${srcPortName} -> ${dstPortName}`;
        }
      }

      table.onmousedown = (event) => {
        if (selectedPatchMode !== PATCH_MODE_PAINT) return;
        if (Number(event.button) !== 0) return;
        const cell = eventClosest(event, "td.cell.editable");
        if (!(cell instanceof HTMLTableCellElement) || !table.contains(cell)) return;
        event.preventDefault();

        endPaintSession();
        const context = resolveEditableCellContext(cell);
        if (!context.ok) {
          setStatus(context.error || "No editable patch point selected.", true);
          return;
        }
        const action = connectionIndexForPair(context.src, context.dst) >= 0 ? "disconnect" : "connect";
        paintSession = {
          action,
          anchor: context,
          changed: 0,
          skipped: 0,
          firstError: "",
          visited: new Set(),
          changedPairs: [],
        };
        window.addEventListener("mouseup", endPaintSession, true);
        window.addEventListener("blur", endPaintSession);
        paintCell(cell);
      };

      table.onmouseover = (event) => {
        if (!paintSession || selectedPatchMode !== PATCH_MODE_PAINT) return;
        const cell = eventClosest(event, "td.cell.editable");
        if (!(cell instanceof HTMLTableCellElement) || !table.contains(cell)) return;
        paintCell(cell);
      };

      function reportPatchResult(result, modeLabel = selectedPatchMode) {
        if (result.changed > 0 && result.action === "connect") {
          setStatus(`Connected ${result.changed} link(s) with ${modeLabel}${result.skipped > 0 ? ` (${result.skipped} skipped)` : ""}.`);
          recordPatchHistory(`Connect ${result.changed} link(s) with ${modeLabel}`);
          queuePatchAutoSave(`${modeLabel}-connect`);
          if (!syncChangedPatchCells(result)) scheduleRender();
          return;
        }
        if (result.changed > 0 && result.action === "disconnect") {
          setStatus(`Disconnected ${result.changed} link(s) with ${modeLabel}${result.skipped > 0 ? ` (${result.skipped} skipped)` : ""}.`);
          recordPatchHistory(`Disconnect ${result.changed} link(s) with ${modeLabel}`);
          queuePatchAutoSave(`${modeLabel}-disconnect`);
          if (!syncChangedPatchCells(result)) scheduleRender();
          return;
        }
        setStatus(result.firstError || "No changes.", true);
      }

      function activatePatchCell(cell, keyboard = false) {
        if (!(cell instanceof HTMLTableCellElement) || !cell.classList.contains("editable")) return;
        if (keyboard && selectedPatchMode === PATCH_MODE_PAINT) {
          reportPatchResult(applyPatchFromCell(cell, "", 1), PATCH_MODE_PAINT);
          return;
        }
        reportPatchResult(applyPatchFromCell(cell, "", patchSpan()), selectedPatchMode);
      }

      function setRovingCellFocus(cell) {
        if (!(cell instanceof HTMLTableCellElement) || !table.contains(cell)) return;
        const control = cell.querySelector(".matrix-cell-control[data-matrix-focus-cell='1']");
        if (!(control instanceof HTMLButtonElement)) return;
        for (const candidate of table.querySelectorAll(".matrix-cell-control[data-matrix-focus-cell='1'][tabindex='0']")) {
          if (candidate !== control) candidate.setAttribute("tabindex", "-1");
        }
        control.tabIndex = 0;
        matrixKeyboardFocusKey = String(control.dataset.matrixFocusKey || "");
      }

      table.onfocusin = (event) => {
        const focusControl = eventClosest(event, ".matrix-cell-control");
        const cell = focusControl?.closest("td.cell");
        if (!(cell instanceof HTMLTableCellElement) || !table.contains(cell)) return;
        setRovingCellFocus(cell);
        applyAxisHover(cell);
      };

      table.onfocusout = () => {
        window.requestAnimationFrame(() => {
          if (!table.contains(document.activeElement)) clearAxisHover();
        });
      };

      table.onkeydown = (event) => {
        const control = eventClosest(event, ".matrix-cell-control");
        const cell = control?.closest("td.cell");
        if (!(cell instanceof HTMLTableCellElement) || !table.contains(cell)) return;

        const directionByKey = {
          ArrowUp: [-1, 0],
          ArrowDown: [1, 0],
          ArrowLeft: [0, -1],
          ArrowRight: [0, 1],
        };
        const direction = directionByKey[event.key];
        const hasAssistiveModifier = event.altKey || event.ctrlKey || event.metaKey;
        if (direction && !hasAssistiveModifier) {
          event.preventDefault();
          const nextCell = matrixCellByIndices(
            Number(cell.dataset.si) + direction[0],
            Number(cell.dataset.di) + direction[1]
          );
          if (!(nextCell instanceof HTMLTableCellElement)) return;
          setRovingCellFocus(nextCell);
          nextCell.querySelector(".matrix-cell-control")?.focus({ preventScroll: true });
          nextCell.scrollIntoView({ block: "nearest", inline: "nearest" });
          return;
        }

        if ((event.key !== "Enter" && event.key !== " ") || hasAssistiveModifier) return;
        event.preventDefault();
        if (control?.getAttribute("role") === "button" && cell.dataset.folderToggle !== "none") {
          cell.click();
          return;
        }
        if (control?.getAttribute("role") === "checkbox" && control.getAttribute("aria-disabled") !== "true") {
          activatePatchCell(cell, true);
          return;
        }
        setStatus(String(cell.dataset.hover || "No action is available for this matrix cell."), true);
      };

      table.onclick = (event) => {
        const headerToggle = eventClosest(event, "[data-device-toggle],[data-group-toggle]");
        if (headerToggle) {
          const axis = String(headerToggle.dataset.axis || "");
          const entry = entryFromToggleDataset(headerToggle.dataset);
          const result = toggleHeaderEntryOnAxis(family, axis, entry);
          if (!result.ok || !result.changed) {
            setStatus("No folder toggle available for this header.", true);
            return;
          }
          setStatus(`${result.action === "collapse" ? "Collapsed" : "Expanded"} ${entry.kind} on ${axis}.`);
          scheduleRender(true);
          return;
        }

        const folderCell = eventClosest(event, "td.cell.groupcell");
        if (folderCell) {
          const si = Number(folderCell.dataset.si);
          const di = Number(folderCell.dataset.di);
          const srcEntry = visibleSources[si];
          const dstEntry = visibleDests[di];
          if (!srcEntry || !dstEntry) return;
          const meta = folderCellToggleMeta(family, srcEntry, dstEntry);
          if (!meta.canToggle) {
            setStatus("No folder toggle available for this cell.", true);
            return;
          }
          const collapse = meta.action === "collapse";
          let toggled = 0;
          if (meta.targetAxis === "both") {
            if (setEntryCollapsedOnAxis(family, "source", srcEntry, collapse)) toggled += 1;
            if (setEntryCollapsedOnAxis(family, "dest", dstEntry, collapse)) toggled += 1;
          } else if (meta.targetAxis === "source") {
            toggled = setEntryCollapsedOnAxis(family, "source", srcEntry, collapse) ? 1 : 0;
          } else if (meta.targetAxis === "dest") {
            toggled = setEntryCollapsedOnAxis(family, "dest", dstEntry, collapse) ? 1 : 0;
          }
          if (!toggled) {
            setStatus("No folder toggle available for this cell.", true);
            return;
          }
          const axisLabel = meta.targetAxis === "both" ? "source + destination folders" : `${meta.targetAxis} folder`;
          setStatus(`${collapse ? "Collapsed" : "Expanded"} ${axisLabel}.`);
          scheduleRender(true);
          return;
        }

        if (selectedPatchMode === PATCH_MODE_PAINT) return;

        const cell = eventClosest(event, "td.cell.editable");
        if (!cell) return;
        activatePatchCell(cell, false);
      };

      configureMatrixRovingFocus(table, focusState);
      validateMatrixAccessibility(table);
      restoreMatrixViewportState(viewportState);
      // Force one sync layout pass so sticky/rotated destination headers settle
      // before the refreshed matrix becomes visible.
      void table.offsetHeight;
      void table.getBoundingClientRect();
      if (matrixWrapEl instanceof HTMLElement) {
        const settledTop = Number(matrixWrapEl.scrollTop || 0);
        const settledLeft = Number(matrixWrapEl.scrollLeft || 0);
        matrixWrapEl.scrollTop = settledTop;
        matrixWrapEl.scrollLeft = settledLeft;
      }
      if (matrixContainer) matrixContainer.style.visibility = prevMatrixVisibility;
      finishMatrixRender(renderStartedAt, visibleSources.length * visibleDests.length);
      window.requestAnimationFrame(() => {
        restoreMatrixViewportState(viewportState);
      });

    }

    function formatEntryLabel(entry) {
      if (!entry) return "Entry";
      if (entry.kind === "port") return `${entry.port.device} [${entry.port.port}]`;
      if (entry.kind === "group") return `${entry.device} [${entry.typeName}]`;
      if (entry.kind === "device") return `${entry.device} [device]`;
      return "Entry";
    }

    function escHtml(text) {
      return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escAttr(text) {
      return escHtml(text).replace(/`/g, "&#96;");
    }

    async function fetchJson(url) {
      const base = String(url || "").trim();
      if (!base) throw new Error("Empty URL");
      const fetchBase = /^(projects|json|defaults|prototypes)\//.test(base) ? `/${base}` : base;
      const target = `${fetchBase}${fetchBase.includes("?") ? "&" : "?"}_ts=${Date.now()}`;
      const response = await fetch(target, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`${response.status} ${response.statusText} @ ${base}`);
      }
      return response.json();
    }

    function canonicalizeJsonForHash(value) {
      if (Array.isArray(value)) return value.map((item) => canonicalizeJsonForHash(item));
      if (value && typeof value === "object") {
        const out = {};
        for (const key of Object.keys(value).sort()) out[key] = canonicalizeJsonForHash(value[key]);
        return out;
      }
      return value;
    }

    async function computeJsonPayloadHash(payload) {
      const text = JSON.stringify(canonicalizeJsonForHash(payload));
      if (!(window.crypto && window.crypto.subtle && typeof TextEncoder !== "undefined")) return "";
      const digest = await window.crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return Array.from(new Uint8Array(digest))
        .map((value) => value.toString(16).padStart(2, "0"))
        .join("");
    }

    async function fetchJsonFromCandidates(candidates) {
      const urls = Array.isArray(candidates) ? candidates : [];
      const errors = [];
      for (const url of urls) {
        try {
          const payload = await fetchJson(url);
          return { payload, url };
        } catch (error) {
          errors.push(String(error));
        }
      }
      throw new Error(errors.join(" | "));
    }

    function projectByKey(key) {
      const token = String(key || "").trim();
      return projectCatalog.find((project) => String(project?.key || "").trim() === token) || null;
    }

    function loadProjectSelectionPreference() {
      try {
        const payload = JSON.parse(window.localStorage.getItem(PROJECT_SELECTION_STORAGE_KEY) || "null");
        if (!payload || typeof payload !== "object" || Array.isArray(payload)) return {};
        return {
          project_key: String(payload.project_key || "").trim(),
          model_path: String(payload.model_path || "").trim(),
          connections_path: String(payload.connections_path || "").trim(),
        };
      } catch (_error) {
        return {};
      }
    }

    function persistProjectSelectionPreference(projectKey, modelPath, connectionsPath) {
      const payload = {
        project_key: String(projectKey || "").trim(),
        model_path: String(modelPath || "").trim(),
        connections_path: String(connectionsPath || "").trim(),
      };
      if (!payload.project_key) return;
      try {
        window.localStorage.setItem(PROJECT_SELECTION_STORAGE_KEY, JSON.stringify(payload));
      } catch (_error) {
        // Selection remains active for this page when storage is unavailable.
      }
    }

    function projectForPath(pathValue) {
      const normalized = normalizeApiTargetPath(pathValue);
      return projectCatalog.find((project) => {
        const base = String(project?.base_path || "").replace(/\/+$/, "");
        return base && (normalized === base || normalized.startsWith(`${base}/`));
      }) || null;
    }

    function setConfigOptions(select, paths, preferred, emptyLabel) {
      if (!(select instanceof HTMLSelectElement)) return "";
      const values = Array.from(new Set((Array.isArray(paths) ? paths : [])
        .map((value) => String(value || "").trim()).filter(Boolean)));
      select.innerHTML = values.length
        ? values.map((value) => {
          const label = decodeURIComponent(value.split("/").pop() || value).replace(/\.json$/i, "");
          return `<option value="${escAttr(value)}">${escHtml(label)}</option>`;
        }).join("")
        : `<option value="">${escHtml(emptyLabel)}</option>`;
      const selected = values.includes(String(preferred || "").trim())
        ? String(preferred || "").trim()
        : (values[0] || "");
      select.value = selected;
      select.disabled = !values.length;
      return selected;
    }

    function patchPathsForModel(project, modelPath) {
      const mapping = project?.device_patch_map;
      if (mapping && typeof mapping === "object") {
        const direct = mapping[modelPath];
        if (Array.isArray(direct) && direct.length) return direct;
      }
      return Array.isArray(project?.patch_configs) ? project.patch_configs : [];
    }

    function updateActiveSaveTargets(project) {
      const base = String(project?.base_path || "").replace(/\/+$/, "");
      const svgDir = String(project?.output_svg_directory || `${base}/outputs/svgs`).trim();
      const debugDir = String(project?.output_debug_directory || `${base}/outputs/debug`).trim();
      const htmlDir = String(project?.output_html_directory || `${base}/outputs/html`).trim();
      activeSaveTargets = {
        routing_rules_path: activeRoutingRulesPath,
        route_debug_path: `${debugDir.replace(/\/+$/, "")}/route-debug.json`,
        preview_html: `${htmlDir.replace(/\/+$/, "")}/studio_wiring_point_to_point.html`,
        preview_svg_dir: svgDir,
      };
    }

    function syncProjectSelectors(project, preferredModel, preferredPatch) {
      if (!project) return;
      applyingProjectSelection = true;
      activeProjectKey = String(project.key || "").trim();
      if (projectSelect instanceof HTMLSelectElement) projectSelect.value = activeProjectKey;
      activeModelPath = setConfigOptions(
        deviceConfigSelect,
        project.device_configs,
        preferredModel || project.default_device_config,
        "No device configs",
      );
      activeConnectionsPath = setConfigOptions(
        patchConfigSelect,
        patchPathsForModel(project, activeModelPath),
        preferredPatch || project.default_patch_config,
        "No patch configs",
      );
      updateActiveSaveTargets(project);
      applyingProjectSelection = false;
    }

    function writeActiveSelectionToUrl() {
      persistProjectSelectionPreference(activeProjectKey, activeModelPath, activeConnectionsPath);
      const url = new URL(window.location.href);
      url.searchParams.set("project_key", activeProjectKey);
      url.searchParams.set("model", activeModelPath);
      url.searchParams.set("connections", activeConnectionsPath);
      window.history.replaceState({}, "", `${url.pathname}${url.search}${url.hash}`);
    }

    async function loadProjectCatalog() {
      if (!(projectSelect instanceof HTMLSelectElement)) return false;
      try {
        const response = await fetch("/api/config", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        activeRoutingRulesPath = String(payload?.routing_rules_path || activeRoutingRulesPath).trim();
        projectCatalog = Array.isArray(payload?.projects) ? payload.projects : [];
        if (!projectCatalog.length) throw new Error("No projects available");
        projectSelect.innerHTML = projectCatalog.map((project) => (
          `<option value="${escAttr(project.key)}">${escHtml(project.name || project.key)}</option>`
        )).join("");
        const hasExplicitSelection = HAS_PROJECT_QUERY_PARAM || HAS_MODEL_QUERY_PARAM || HAS_CONNECTIONS_QUERY_PARAM;
        const storedSelection = hasExplicitSelection ? {} : loadProjectSelectionPreference();
        const preferredProjectKey = activeProjectKey || String(storedSelection.project_key || "").trim();
        const preferredModelPath = activeModelPath || String(storedSelection.model_path || "").trim();
        const preferredConnectionsPath = activeConnectionsPath || String(storedSelection.connections_path || "").trim();
        const selectedProject = projectByKey(preferredProjectKey)
          || projectForPath(preferredModelPath)
          || projectByKey(payload?.active_project_key)
          || projectCatalog[0];
        syncProjectSelectors(selectedProject, preferredModelPath, preferredConnectionsPath);
        return true;
      } catch (error) {
        projectCatalog = [];
        projectSelect.innerHTML = '<option value="">Standalone sandbox</option>';
        projectSelect.disabled = true;
        if (deviceConfigSelect instanceof HTMLSelectElement) deviceConfigSelect.disabled = true;
        if (patchConfigSelect instanceof HTMLSelectElement) patchConfigSelect.disabled = true;
        return false;
      }
    }

    async function applyProjectSelection(reason) {
      if (applyingProjectSelection) return;
      if (patchDirty && !window.confirm("Discard unsaved patch changes and switch project?")) {
        projectSelect.value = activeProjectKey;
        return;
      }
      const project = projectByKey(projectSelect?.value);
      if (!project) return;
      syncProjectSelectors(project, "", "");
      writeActiveSelectionToUrl();
      await reloadData(reason);
    }

    async function applyDeviceSelection(reason) {
      if (applyingProjectSelection) return;
      if (patchDirty && !window.confirm("Discard unsaved patch changes and switch device config?")) {
        deviceConfigSelect.value = activeModelPath;
        return;
      }
      const project = projectByKey(activeProjectKey);
      if (!project) return;
      activeModelPath = String(deviceConfigSelect?.value || "").trim();
      applyingProjectSelection = true;
      activeConnectionsPath = setConfigOptions(
        patchConfigSelect,
        patchPathsForModel(project, activeModelPath),
        project.default_patch_config,
        "No patch configs",
      );
      applyingProjectSelection = false;
      writeActiveSelectionToUrl();
      await reloadData(reason);
    }

    async function applyPatchSelection(reason) {
      if (applyingProjectSelection) return;
      if (patchDirty && !window.confirm("Discard unsaved patch changes and switch patch config?")) {
        patchConfigSelect.value = activeConnectionsPath;
        return;
      }
      activeConnectionsPath = String(patchConfigSelect?.value || "").trim();
      writeActiveSelectionToUrl();
      await reloadData(reason);
    }

    function initFamilySelect() {
      const previous = String(familySelect.value || "").trim();
      const defs = MODEL && typeof MODEL.families === "object" ? MODEL.families : {};
      const keys = [FAMILY_ALL, ...FAMILY_ORDER];
      for (const key of Object.keys(defs)) {
        const fam = normalizeFamily(key);
        if (fam && !keys.includes(fam)) keys.push(fam);
      }
      familySelect.innerHTML = keys.map((fam) => `<option value=\"${escAttr(fam)}\">${escHtml(fam)}</option>`).join("");
      if (previous && keys.includes(previous)) {
        familySelect.value = previous;
      } else if (keys.includes(FAMILY_ALL)) {
        familySelect.value = FAMILY_ALL;
      } else if (keys.includes("AUDIO")) {
        familySelect.value = "AUDIO";
      } else if (keys.length > 0) {
        familySelect.value = keys[0];
      }
    }

    function filenameFromUrl(rawUrl) {
      const token = String(rawUrl || "").trim();
      if (!token) return "";
      try {
        const url = new URL(token, window.location.href);
        const path = String(url.pathname || "");
        return decodeURIComponent(path.split("/").filter(Boolean).pop() || "");
      } catch (_error) {
        const path = token.split("?")[0].split("#")[0];
        return decodeURIComponent(path.split("/").filter(Boolean).pop() || "");
      }
    }

    function stripUrlQueryHash(rawUrl) {
      const token = String(rawUrl || "").trim();
      if (!token) return "";
      try {
        const url = new URL(token, window.location.href);
        url.search = "";
        url.hash = "";
        return url.toString();
      } catch (_error) {
        return token.split("?")[0].split("#")[0];
      }
    }

    function normalizePatchFilename(name) {
      let token = String(name || "").trim();
      if (!token) token = "routing_matrix_connections.prototype.json";
      token = token.replace(/[\\/:*?"<>|]+/g, "_");
      if (!/\.json$/i.test(token)) token += ".json";
      return token;
    }

    function buildPatchPayload() {
      return {
        version: 1,
        connections: connections.map((row) => ({ ...row })),
      };
    }

    function downloadPatchPayload(payloadText, filename) {
      const blob = new Blob([payloadText], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = normalizePatchFilename(filename);
      a.click();
      URL.revokeObjectURL(url);
    }

    async function writePatchToHandle(fileHandle, payloadText) {
      const writable = await fileHandle.createWritable();
      await writable.write(payloadText);
      await writable.close();
    }

    async function writePatchToSourceUrl(sourceUrl, payloadText) {
      const target = stripUrlQueryHash(sourceUrl);
      if (!target) throw new Error("No patch source path available");
      const response = await fetch(target, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: payloadText,
      });
      if (!response.ok) {
        throw new Error(`${response.status} ${response.statusText}`);
      }
      return target;
    }

    class SaveApiError extends Error {
      constructor(message, status = 0) {
        super(message);
        this.name = "SaveApiError";
        this.status = Number(status || 0);
      }
    }

    function isSaveConflictError(error) {
      return error instanceof SaveApiError && (error.status === 409 || error.status === 412);
    }

    async function writePatchToSaveApi(apiUrl, payloadObject) {
      const target = String(apiUrl || "").trim();
      if (!target) throw new Error("No save API target configured");
      const response = await fetch(target, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payloadObject),
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new SaveApiError(
          String(result?.error || `${response.status} ${response.statusText}`),
          response.status,
        );
      }
      if (result && typeof result === "object" && result.ok === false) {
        throw new Error(String(result.error || "Save API rejected patch payload"));
      }
      return result;
    }

    function normalizeApiTargetPath(rawPath) {
      let token = String(rawPath || "").trim();
      if (!token) return "";
      try {
        const parsed = new URL(token, window.location.href);
        if (/^[a-z][a-z0-9+.-]*:/i.test(token) && parsed.origin !== window.location.origin) {
          return "";
        }
        token = String(parsed.pathname || "").trim();
      } catch (_error) {
        // Keep raw token.
      }
      token = token.split("?")[0].split("#")[0].trim();
      if (!token) return "";
      token = token.replace(/^\.\/+/, "");
      token = token.replace(/^\/+/, "");
      if (token.startsWith("sandbox/")) {
        token = `prototypes/${token}`;
      }
      return token;
    }

    function buildSaveTargetsPayload() {
      const payload = { ...activeSaveTargets };
      const modelTarget = normalizeApiTargetPath(activeModelPath) || normalizeApiTargetPath(modelSourceUrl);
      const patchTarget = normalizeApiTargetPath(activeConnectionsPath) || normalizeApiTargetPath(patchSourceUrl);
      if (modelTarget) payload.model_path = modelTarget;
      if (patchTarget) payload.connections_path = patchTarget;
      for (const key of ["routing_rules_path", "route_debug_path", "preview_html", "preview_svg_dir"]) {
        const value = normalizeApiTargetPath(QUERY_PARAMS.get(key));
        if (value) payload[key] = value;
      }
      return payload;
    }

    function inferSaveProjectKey(targets) {
      if (activeProjectKey) return activeProjectKey;
      for (const key of ["model_path", "connections_path"]) {
        const match = String(targets?.[key] || "").match(/^projects\/([^/]+)\//);
        if (match) return match[1];
      }
      return "";
    }

    function buildPatchSaveTransaction(payloadObject, reason) {
      const targets = buildSaveTargetsPayload();
      const required = [
        "model_path", "connections_path", "routing_rules_path",
        "route_debug_path", "preview_html", "preview_svg_dir",
      ];
      const missing = required.filter((key) => !String(targets[key] || "").trim());
      if (missing.length) throw new Error(`Missing save target(s): ${missing.join(", ")}`);
      const projectKey = inferSaveProjectKey(targets);
      if (!projectKey) throw new Error("Missing project key for patch save");
      return {
        project_key: projectKey,
        targets,
        changes: { connections: payloadObject },
        expected_hashes: { connections: String(loadedPatchVersionHash || "").trim() },
        reason: String(reason || "prototype-patch-save"),
        regenerate: true,
      };
    }

    function shouldAutoTrySaveApi() {
      // In browser-served contexts, prefer server save endpoint over unsupported PUT writes.
      return window.location.protocol === "http:" || window.location.protocol === "https:";
    }

    async function savePatch(saveAs = false, options = {}) {
      const saveRequestId = markPatchSaveStarted();
      let savingFingerprint = "";
      const finishSave = (success) => {
        markPatchSaveFinished(Boolean(success), savingFingerprint, saveRequestId);
        return Boolean(success);
      };
      const silent = Boolean(options?.silent);
      const auto = Boolean(options?.auto);
      const reason = String(options?.reason || "").trim() || "change";
      const payloadObject = buildPatchPayload();
      const payloadText = JSON.stringify(payloadObject, null, 2);
      savingFingerprint = patchFingerprint(payloadObject.connections);
      const canUseFilePicker = typeof window.showSaveFilePicker === "function";
      const defaultName = normalizePatchFilename(patchFileName);

      if (!saveAs && (USE_SAVE_API || shouldAutoTrySaveApi())) {
        try {
          const transaction = buildPatchSaveTransaction(payloadObject, reason);
          const apiResult = await writePatchToSaveApi(SAVE_TRANSACTION_API, transaction);
          loadedPatchVersionHash = String(apiResult?.saved?.hashes?.connections || "").trim();
          if (apiResult?.regeneration?.attempted && apiResult?.regeneration?.ok === false) {
            const warning = String(apiResult?.regeneration?.error || "unknown error");
            setStatus(
              silent
                ? `Auto-save patch warning (${reason}): ${warning}`
                : `Saved patch JSON via API, but regenerate failed: ${warning}`,
              true
            );
          } else if (!silent) {
            setStatus(`Saved patch JSON via transaction API: ${SAVE_TRANSACTION_API}`);
          }
          return finishSave(true);
        } catch (error) {
          if (isSaveConflictError(error)) {
            setStatus("Patch changed on disk. Reload the selected patch, review changes, and retry save.", true);
            return finishSave(false, saveRequestId);
          }
          if (USE_SAVE_API) {
            const detail = String(error);
            if (silent || auto) {
              setStatus(`Auto-save patch failed (${reason}): ${detail}`, true);
            } else {
              setStatus(`Save API patch save failed (${detail}). Falling back to local save options...`, true);
            }
            if (auto) return finishSave(false);
          }
        }
      }

      if (!saveAs && patchFileHandle && canUseFilePicker) {
        try {
          await writePatchToHandle(patchFileHandle, payloadText);
          const handleName = String(patchFileHandle.name || "").trim();
          if (handleName) patchFileName = normalizePatchFilename(handleName);
          if (!silent) {
            setStatus(`Saved patch JSON: ${patchFileName}`);
          }
          return finishSave(true);
        } catch (error) {
          const detail = String(error);
          if (silent || auto) {
            setStatus(`Auto-save patch quick-save failed (${reason}): ${detail}`, true);
          } else {
            setStatus(
              ALLOW_SOURCE_PUT
                ? `Quick save failed (${detail}). Trying source-path overwrite...`
                : `Quick save failed (${detail}).`,
              true
            );
          }
          if (auto) return finishSave(false);
        }
      }

      if (!saveAs && ALLOW_SOURCE_PUT && patchSourceUrl) {
        try {
          const savedUrl = await writePatchToSourceUrl(patchSourceUrl, payloadText);
          patchFileName = normalizePatchFilename(filenameFromUrl(savedUrl) || patchFileName);
          if (!silent) {
            setStatus(`Saved patch JSON: ${patchFileName}`);
          }
          return finishSave(true);
        } catch (error) {
          const detail = String(error);
          if (silent || auto) {
            setStatus(`Auto-save patch source-path overwrite failed (${reason}): ${detail}`, true);
          } else {
            setStatus(`Source-path overwrite failed (${detail}).`, true);
          }
          if (auto) return finishSave(false);
        }
      }

      if (auto || silent) {
        setStatus("Auto-save patch skipped: no non-interactive save target available.", true);
        return finishSave(false);
      }

      if (canUseFilePicker) {
        try {
          const fileHandle = await window.showSaveFilePicker({
            suggestedName: defaultName,
            types: [{
              description: "JSON",
              accept: { "application/json": [".json"] },
            }],
          });
          await writePatchToHandle(fileHandle, payloadText);
          patchFileHandle = fileHandle;
          patchFileName = normalizePatchFilename(String(fileHandle.name || defaultName));
          setStatus(`Saved patch JSON: ${patchFileName}`);
          return finishSave(true);
        } catch (error) {
          if (error && String(error.name || "") === "AbortError") {
            setStatus("Save cancelled.");
            return finishSave(false);
          }
          setStatus(
            saveAs
              ? `Save picker failed (${String(error)}). Falling back to download.`
              : `Save picker failed (${String(error)}).`,
            true
          );
        }
      }

      if (!saveAs) {
        setStatus("Could not overwrite existing patch file. Use Save Patch As to pick the existing patch JSON once, then Save Patch will overwrite it.", true);
        return finishSave(false);
      }

      let filename = defaultName;
      if (saveAs) {
        const typed = window.prompt("Save patch as filename", defaultName);
        if (typed === null) {
          setStatus("Save cancelled.");
          return finishSave(false);
        }
        filename = normalizePatchFilename(typed);
      }
      patchFileHandle = null;
      patchFileName = filename;
      downloadPatchPayload(payloadText, filename);
      setStatus(`Downloaded patch JSON: ${filename}`);
      return finishSave(true);
    }

    async function reloadData(reason = "reload") {
      try {
        const explicitSelectionMode = HAS_MODEL_QUERY_PARAM || HAS_CONNECTIONS_QUERY_PARAM;
        setStatus(explicitSelectionMode
          ? "Loading selected prototype JSON..."
          : "Loading prototype sandbox JSON...");
        const modelCandidates = modelUrlCandidates();
        const connectionCandidates = connectionsUrlCandidates();
        const modelResult = modelCandidates.length > 0
          ? await fetchJsonFromCandidates(modelCandidates)
          : { payload: { devices: [], families: {} }, url: "" };
        const connResult = connectionCandidates.length > 0
          ? await fetchJsonFromCandidates(connectionCandidates)
          : { payload: { version: 1, connections: [] }, url: "" };
        const modelPayload = modelResult.payload;
        const connPayload = connResult.payload;
        loadedPatchVersionHash = await computeJsonPayloadHash(connPayload);
        MODEL = modelPayload && typeof modelPayload === "object" ? modelPayload : { devices: [], families: {} };
        applyThemeFromModel(MODEL);
        const matrixCfg = getPath(MODEL, ["ui_config", "matrix"], {});
        allowDoublePatching = parseBoolLike(
          matrixCfg.allow_double_patching,
          ALLOW_DOUBLE_PATCHING_DEFAULT
        );
        if (allowDoublePatchingToggle instanceof HTMLInputElement) {
          allowDoublePatchingToggle.checked = allowDoublePatching;
        }
        invalidatePortCaches();
        const rows = Array.isArray(connPayload && connPayload.connections)
          ? connPayload.connections
          : (Array.isArray(connPayload) ? connPayload : []);
        connections = rows.map(normalizeConnection).filter((row) => row.source_device && row.source_port && row.dest_device && row.dest_port);
        cableIdAllocator = buildCableIdAllocator(connections);
        for (const row of connections) {
          if (!String(row.cable_id || "").trim()) {
            row.cable_id = nextCableId(cableIdAllocator, row.family);
          }
        }
        rebuildConnectionLookups();
        resetPatchHistory("Loaded patch");
        collapsedSourceDevices.clear();
        collapsedDestDevices.clear();
        collapsedSourceGroups.clear();
        collapsedDestGroups.clear();
        autoCollapsedFamilies.clear();
        autoCollapsedDeviceFamilies.clear();
        patchFileHandle = null;
        modelSourceUrl = modelResult.url ? stripUrlQueryHash(modelResult.url) : "";
        patchSourceUrl = connResult.url ? stripUrlQueryHash(connResult.url) : "";
        if (connResult.url) {
          patchFileName = normalizePatchFilename(filenameFromUrl(connResult.url) || patchFileName);
        } else if (!patchFileName) {
          patchFileName = "routing_matrix_connections.prototype.json";
        }
        initFamilySelect();
        scheduleRender();
        const loadedModelLabel = modelResult.url || "(empty model)";
        const loadedPatchLabel = connResult.url || "(empty patch)";
        setStatus(`Loaded model: ${loadedModelLabel} | patch: ${loadedPatchLabel} [${reason}]`);
      } catch (error) {
        matrixContainer.innerHTML = `<div style=\"padding:12px;color:#fca5a5;\">Load failed: ${escHtml(String(error))}</div>`;
        setStatus(`Load failed: ${String(error)}`, true);
      }
    }

    familySelect.onchange = () => scheduleRender();
    if (patchModeSelect) {
      patchModeSelect.value = selectedPatchMode;
      patchModeSelect.onchange = () => {
        selectedPatchMode = normalizePatchMode(patchModeSelect.value);
        if (selectedPatchMode !== PATCH_MODE_MULTI) {
          pairCountInput.disabled = true;
        } else {
          pairCountInput.disabled = false;
        }
        scheduleRender();
      };
    }
    if (pairCountInput) {
      pairCountInput.value = String(pairCount);
      pairCountInput.disabled = selectedPatchMode !== PATCH_MODE_MULTI;
      pairCountInput.oninput = () => {
        pairCount = normalizePairCount(pairCountInput.value);
        pairCountInput.value = String(pairCount);
        if (selectedPatchMode === PATCH_MODE_MULTI) scheduleRender();
      };
    }
    if (typeTagInput) {
      typeTagInput.value = typeTagValue;
      typeTagInput.oninput = () => {
        typeTagValue = String(typeTagInput.value || "").trim();
      };
    }
    if (allowDoublePatchingToggle instanceof HTMLInputElement) {
      allowDoublePatchingToggle.checked = allowDoublePatching;
      allowDoublePatchingToggle.onchange = () => {
        allowDoublePatching = Boolean(allowDoublePatchingToggle.checked);
        setStatus(`Allow Double Patching: ${allowDoublePatching ? "On" : "Off"}`);
      };
    }
    if (sourceFilterInput) {
      sourceFilterInput.value = sourceFilter;
      sourceFilterInput.oninput = () => {
        sourceFilter = String(sourceFilterInput.value || "");
        scheduleRender();
      };
    }
    if (destFilterInput) {
      destFilterInput.value = destFilter;
      destFilterInput.oninput = () => {
        destFilter = String(destFilterInput.value || "");
        scheduleRender();
      };
    }
    collapseSourceBtn.onclick = () => {
      const family = String(familySelect.value || "AUDIO");
      const sourceEntries = buildAxisEntries(family, portsForFamily(family, true), "source", collapsedSourceGroups, collapsedSourceDevices);
      setAxisCollapsed(sourceEntries, "source", true);
      scheduleRender(true);
    };
    expandSourceBtn.onclick = () => {
      const family = String(familySelect.value || "AUDIO");
      const sourceEntries = buildAxisEntries(family, portsForFamily(family, true), "source", collapsedSourceGroups, collapsedSourceDevices);
      setAxisCollapsed(sourceEntries, "source", false);
      scheduleRender(true);
    };
    collapseDestBtn.onclick = () => {
      const family = String(familySelect.value || "AUDIO");
      const destEntries = buildAxisEntries(family, portsForFamily(family, false), "dest", collapsedDestGroups, collapsedDestDevices);
      setAxisCollapsed(destEntries, "dest", true);
      scheduleRender(true);
    };
    expandDestBtn.onclick = () => {
      const family = String(familySelect.value || "AUDIO");
      const destEntries = buildAxisEntries(family, portsForFamily(family, false), "dest", collapsedDestGroups, collapsedDestDevices);
      setAxisCollapsed(destEntries, "dest", false);
      scheduleRender(true);
    };
    if (undoBtn instanceof HTMLButtonElement) undoBtn.onclick = () => {
      if (!undoPatch()) setStatus("Nothing to undo.", true);
    };
    if (redoBtn instanceof HTMLButtonElement) redoBtn.onclick = () => {
      if (!redoPatch()) setStatus("Nothing to redo.", true);
    };
    document.addEventListener("keydown", (event) => {
      const target = event.target instanceof HTMLElement ? event.target : null;
      if (target && (target.matches("input, textarea, select") || target.isContentEditable)) return;
      const commandModifier = event.metaKey || event.ctrlKey;
      if (!commandModifier || event.altKey) return;
      const key = String(event.key || "").toLowerCase();
      const wantsRedo = (key === "z" && event.shiftKey) || (key === "y" && event.ctrlKey && !event.metaKey);
      const wantsUndo = key === "z" && !event.shiftKey;
      if (!wantsUndo && !wantsRedo) return;
      event.preventDefault();
      if (wantsRedo) {
        if (!redoPatch()) setStatus("Nothing to redo.", true);
      } else if (!undoPatch()) {
        setStatus("Nothing to undo.", true);
      }
    });
    window.addEventListener("beforeunload", (event) => {
      if (!patchDirty || lastSaveSucceeded) return;
      event.preventDefault();
      event.returnValue = "";
    });
    window.addEventListener("message", (event) => {
      const data = event?.data;
      if (!data || typeof data !== "object") return;
      if (data.type === "studio-theme-set") {
        const incoming = normalizeThemeMode(data.mode);
        if (!incoming) return;
        themeOverrideMode = incoming;
        applyThemeMode(incoming);
        return;
      }
      if (data.type === "studio-prototype-autosave-set") {
        setAutoSaveConfigsEnabled(Boolean(data.enabled), false);
        return;
      }
      if (data.type === "studio-shell-autosave-set") {
        setAutoSaveConfigsEnabled(Boolean(data.enabled), false);
        return;
      }
      if (data.type === "studio-shell-autosave-request") {
        window.parent.postMessage({
          type: "studio-shell-autosave-state",
          enabled: autoSaveConfigsEnabled,
        }, "*");
        return;
      }
      if (data.type === "studio-shell-autosave-flush") {
        const requestId = String(data.request_id || "");
        void flushPatchAutoSave(String(data.reason || "shell-navigation")).then((ok) => {
          window.parent.postMessage({
            type: "studio-shell-autosave-flushed",
            request_id: requestId,
            ok: Boolean(ok),
          }, "*");
        });
        return;
      }
      if (data.type === "studio-prototype-save-patch") {
        const saveAs = Boolean(data.save_as);
        void savePatch(saveAs);
      }
    });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden" && autoSaveConfigsEnabled && patchDirty) {
        void flushPatchAutoSave("window-hidden");
      }
    });

    bindMatrixDiagonalPan();
    if (projectSelect instanceof HTMLSelectElement) {
      projectSelect.addEventListener("change", () => void applyProjectSelection("project-selection"));
    }
    if (deviceConfigSelect instanceof HTMLSelectElement) {
      deviceConfigSelect.addEventListener("change", () => void applyDeviceSelection("device-selection"));
    }
    if (patchConfigSelect instanceof HTMLSelectElement) {
      patchConfigSelect.addEventListener("change", () => void applyPatchSelection("patch-selection"));
    }
    void loadProjectCatalog().then(() => {
      writeActiveSelectionToUrl();
      return reloadData("startup");
    });
  </script>
</body>
</html>
