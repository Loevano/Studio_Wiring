<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Prototype Lab (Sandbox) | Routing Matrix Prototype (Compact)</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f5f9;
      --panel: #ffffff;
      --panel-2: #eef2f8;
      --ink: #1b2840;
      --muted: #5f738f;
      --border: #c9d5e4;
      --cell: #f9f2dc;
      --cell-on: #d9fbe8;
      --cell-on-ink: #0f172a;
      --cell-on-border: #22c55e;
      --row-hover: #6db8bf;
      --col-hover: #75c5cb;
      --point-hover: #0f8d97;
      --sticky: #dbe4f0;
      --sticky-2: #cdd8e7;
      --button: #eff3f9;
      --button-hover: #d9e3f2;
      --warn: #b91c1c;
      --ok: #0369a1;
      --matrix-bg: #edf2f8;
      --filter-bg: #ffffff;
      --filter-border: #b8c9de;
      --filter-ink: #1b2840;
      --dest-label-ink: #314862;
      --dest-group-ink: #2a5e95;
      --dest-device-ink: #1b2840;
      --source-device-ink: #1b2840;
      --source-group-ink: #2a5e95;
      --source-port-ink: #30445d;
      --hover-outline: #2f6ef2;
      --group-cell-bg: #e4edf8;
      --group-cell-ink: #557195;
      --folder-source-bg: #dfe8f5;
      --folder-dest-bg: #d7e6f6;
      --folder-junction-bg: #cfdef0;
      --folder-device-bg: #d3dfef;
      --folder-group-bg: #dbe7f7;
      --folder-toggle-bg: #ffffff;
      --folder-toggle-border: #9cb3cf;
      --folder-toggle-ink: #1f3b5d;
      --axis-cell-light: #f9f2dc;
      --axis-cell-medium: #dde8f6;
      --axis-cell-dark: #cbd9ee;
      --disabled-cell-bg: #edf2f8;
      --disabled-cell-ink: #95a6bb;
      --axis-hover-overlay: rgba(15, 141, 151, 0.12);
      --tooltip-bg: rgba(255, 255, 255, 0.98);
      --tooltip-ink: #1b2840;
      --tooltip-border: #b8c9de;
      --empty-ink: #5f738f;
      --incompatible-cell-bg: #fde2e2;
      --incompatible-cell-ink: #991b1b;
      --incompatible-cell-border: #fca5a5;
      --matrix-row-size: 34px;
      --matrix-col-size: 36px;
      --dest-header-size: 168px;
      --axis-header-size: 360px;
    }
    body.theme-dark {
      color-scheme: dark;
      --bg: #0a0f14;
      --panel: #111822;
      --panel-2: #171f2b;
      --ink: #dbe5f3;
      --muted: #8ea2bb;
      --border: #2a3a4d;
      --cell: #1a232f;
      --cell-on: #14532d;
      --cell-on-ink: #dcfce7;
      --cell-on-border: #22c55e;
      --row-hover: #0e5b62;
      --col-hover: #0f6d74;
      --point-hover: #0dc8d4;
      --sticky: #141d28;
      --sticky-2: #1a2533;
      --button: #1f2b3a;
      --button-hover: #2a3b51;
      --warn: #f87171;
      --ok: #38bdf8;
      --matrix-bg: #0f1620;
      --filter-bg: #28384b;
      --filter-border: #314559;
      --filter-ink: #dbe5f3;
      --dest-label-ink: #c6d5e9;
      --dest-group-ink: #9ec5f0;
      --dest-device-ink: #dbe5f3;
      --source-device-ink: #e7effa;
      --source-group-ink: #a9c6ea;
      --source-port-ink: #dbe5f3;
      --hover-outline: #5fa3ff;
      --group-cell-bg: #202b39;
      --group-cell-ink: #90a6be;
      --folder-source-bg: #202f40;
      --folder-dest-bg: #1f3146;
      --folder-junction-bg: #223850;
      --folder-device-bg: #263343;
      --folder-group-bg: #223245;
      --folder-toggle-bg: #122131;
      --folder-toggle-border: #40556e;
      --folder-toggle-ink: #cfe3ff;
      --axis-cell-light: #1a232f;
      --axis-cell-medium: #223245;
      --axis-cell-dark: #2a3b52;
      --disabled-cell-bg: #192330;
      --disabled-cell-ink: #66788f;
      --axis-hover-overlay: rgba(13, 200, 212, 0.08);
      --tooltip-bg: rgba(7, 12, 19, 0.96);
      --tooltip-ink: #dbe5f3;
      --tooltip-border: #3c4f66;
      --empty-ink: #8ea2bb;
      --incompatible-cell-bg: #40202a;
      --incompatible-cell-ink: #fecaca;
      --incompatible-cell-border: #b91c1c;
    }
    * { box-sizing: border-box; }
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    body {
      font-family: Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .app {
      width: 100%;
      height: 100vh;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
      padding: 12px;
      overflow: hidden;
    }
    @supports (height: 100dvh) {
      .app {
        height: 100dvh;
      }
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      min-width: 0;
    }
    .title {
      margin: 0;
      font-size: 1.2rem;
    }
    .meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .toolbar {
      display: grid;
      gap: 10px;
      align-items: stretch;
    }
    .toolbar-fields {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 8px 12px;
      align-items: end;
    }
    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .toolbar-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel-2);
      min-height: 40px;
    }
    .toolbar-group-label {
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      padding-right: 2px;
      white-space: nowrap;
    }
    .toolbar-group button {
      min-width: 86px;
    }
    .save-state {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 32px;
      padding: 0 9px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .save-state::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
    }
    .save-state.dirty::before { background: var(--warn); }
    .save-state.saving::before {
      background: var(--point-hover);
      animation: save-state-pulse 0.9s ease-in-out infinite alternate;
    }
    @keyframes save-state-pulse {
      from { opacity: 0.35; }
      to { opacity: 1; }
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: var(--muted);
      font-size: 0.78rem;
    }
    .toggle-field {
      flex-direction: row;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      font-size: 0.82rem;
      font-weight: 600;
      margin-top: 18px;
      white-space: nowrap;
    }
    .toggle-field input {
      min-height: auto;
      width: 16px;
      height: 16px;
      margin: 0;
    }
    input, select, button {
      min-height: 30px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--button);
      color: var(--ink);
      padding: 4px 8px;
      font-size: 0.82rem;
    }
    select {
      -webkit-appearance: none;
      appearance: none;
      background-image: none;
      box-shadow: none;
    }
    button:hover {
      background: var(--button-hover);
      cursor: pointer;
    }
    .status {
      min-height: 1em;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .status.warn { color: var(--warn); }
    .status.ok { color: var(--ok); }

    .matrix-wrap {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: auto;
      padding: 0;
      width: 100%;
      max-width: 100%;
      height: auto;
      min-width: 0;
      min-height: 0;
      background: var(--matrix-bg);
      background-clip: padding-box;
      position: relative;
      isolation: isolate;
      overflow-anchor: none;
      -webkit-overflow-scrolling: touch;
      scrollbar-gutter: stable;
    }
    .matrix-wrap.matrix-panning {
      cursor: grabbing;
      user-select: none;
    }
    table {
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      min-width: max-content;
      position: relative;
      z-index: 0;
    }
    th, td {
      border: 1px solid var(--border);
      border-left-width: 0;
      border-top-width: 0;
      padding: 0;
    }
    tr:first-child th,
    tr:first-child td {
      border-top-width: 1px;
    }
    th:first-child,
    td:first-child {
      border-left-width: 1px;
    }

    thead {
      position: sticky;
      top: 0;
      z-index: 60;
    }
    .sticky-top {
      position: sticky;
      top: 0;
      z-index: 60;
      background: var(--sticky);
      background-clip: padding-box;
    }
    .sticky-left {
      position: sticky;
      left: 0;
      z-index: 50;
      background: var(--sticky);
      background-clip: padding-box;
    }
    tbody .sticky-left {
      z-index: 52;
      background: var(--sticky);
    }
    thead .sticky-left {
      z-index: 70;
    }
    .top-left {
      z-index: 80;
      min-width: var(--axis-header-size);
      width: var(--axis-header-size);
      max-width: var(--axis-header-size);
      vertical-align: top;
      background: var(--sticky-2);
      background-clip: padding-box;
    }
    tbody td {
      position: relative;
      z-index: 1;
    }

    .tl-box {
      height: calc(var(--dest-header-size) - 8px);
      display: grid;
      grid-template-rows: auto auto;
      gap: 8px;
      padding: 10px;
      align-content: start;
    }
    .tl-box .mini,
    .tl-box .line {
      font-size: 0.76rem;
      color: var(--muted);
      line-height: 1.25;
    }
    .tl-axis-metrics {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .axis-metric {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .icon-btn {
      width: 24px;
      min-width: 24px;
      height: 24px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      font-weight: 700;
    }

    .dest-col-head {
      width: var(--matrix-col-size);
      min-width: var(--matrix-col-size);
      max-width: var(--matrix-col-size);
      height: var(--dest-header-size);
      min-height: var(--dest-header-size);
      max-height: var(--dest-header-size);
      vertical-align: top;
      background: var(--sticky);
    }
    .dest-col-head.dest-kind-device { background: var(--folder-device-bg); }
    .dest-col-head.dest-kind-group { background: var(--folder-group-bg); }
    .dest-col-inner {
      height: var(--dest-header-size);
      display: grid;
      grid-template-rows: 20px 1fr;
      align-items: start;
      justify-items: center;
      padding: 4px 1px;
      gap: 4px;
    }
    .dest-col-inner.port {
      grid-template-rows: 1fr;
      padding-top: 6px;
    }
    .dest-head-line {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 3px;
      min-width: 0;
      min-height: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .dest-head-line.folder {
      justify-content: flex-start;
      padding-top: 2px;
    }
    .dest-head-line.port {
      display: grid;
      grid-template-rows: auto 1fr;
      justify-items: center;
      align-content: start;
      padding-top: 1px;
    }
    .dest-icon-wrap {
      min-height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .dest-icon-wrap .conn-icon {
      min-width: 30px;
      height: 16px;
      font-size: 0.69rem;
    }
    .dest-name {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      text-align: left;
      font-size: 0.78rem;
      line-height: 1.03;
      max-height: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: inline-block;
    }
    .dest-head-line.folder .dest-name {
      flex: 1 1 auto;
      min-height: 0;
    }
    .dest-name.device {
      font-weight: 700;
      color: var(--source-device-ink);
    }
    .dest-name.group {
      font-weight: 700;
      color: var(--source-group-ink);
    }
    .dest-name.port {
      font-weight: 600;
      color: var(--dest-label-ink);
      max-height: none;
      height: 100%;
      margin-top: 2px;
    }
    .dest-count {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 0.7rem;
      line-height: 1;
      max-height: 24px;
      overflow: hidden;
      white-space: nowrap;
    }

    .source-head {
      min-width: var(--axis-header-size);
      width: var(--axis-header-size);
      max-width: var(--axis-header-size);
      height: var(--matrix-row-size);
      min-height: var(--matrix-row-size);
      max-height: var(--matrix-row-size);
      background: var(--sticky);
      color: var(--source-port-ink);
      font-size: 0.78rem;
      text-align: left;
      padding: 0 8px;
    }
    .source-head.source-kind-device { background: var(--folder-device-bg); }
    .source-head.source-kind-group { background: var(--folder-group-bg); }
    .source-line {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .source-line .name {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .source-line .name.device {
      font-weight: 700;
      color: var(--source-device-ink);
    }
    .source-line .name.group {
      font-weight: 700;
      color: var(--source-group-ink);
    }
    .source-line .name.port {
      font-weight: 500;
      color: var(--source-port-ink);
    }
    .source-line .count {
      margin-left: auto;
      flex: 0 0 auto;
      padding-left: 6px;
      color: var(--muted);
      font-size: 0.7rem;
    }

    td.cell {
      width: var(--matrix-col-size);
      min-width: var(--matrix-col-size);
      max-width: var(--matrix-col-size);
      height: var(--matrix-row-size);
      min-height: var(--matrix-row-size);
      max-height: var(--matrix-row-size);
      background: var(--cell);
      text-align: center;
      vertical-align: middle;
      font-size: 0.76rem;
      user-select: none;
    }
    td.cell.editable { cursor: pointer; }
    td.cell.editable:hover { outline: 1px solid var(--hover-outline); outline-offset: -1px; }
    td.cell.on {
      background: var(--cell-on);
      color: var(--cell-on-ink);
      font-weight: 800;
      box-shadow: inset 0 0 0 1px var(--cell-on-border);
    }
    td.cell.groupcell {
      background: var(--group-cell-bg);
      color: var(--group-cell-ink);
      font-weight: 700;
      cursor: pointer;
    }
    td.cell.folder-source { color: #4e6888; }
    td.cell.folder-dest { color: #486b8d; }
    td.cell.folder-junction { color: #3f5f82; }
    body.theme-dark td.cell.folder-source { color: #9bb7d6; }
    body.theme-dark td.cell.folder-dest { color: #a7c6e8; }
    body.theme-dark td.cell.folder-junction { color: #b4d0ee; }
    td.cell.groupcell:hover {
      outline: 1px solid var(--hover-outline);
      outline-offset: -1px;
    }
    td.cell.folder-source { background: var(--folder-source-bg); }
    td.cell.folder-dest { background: var(--folder-dest-bg); }
    td.cell.folder-junction { background: var(--folder-junction-bg); }
    td.cell.groupcell.axis-base:not(.disabled) { background: var(--axis-cell-light); }
    td.cell.groupcell.axis-group:not(.disabled) { background: var(--axis-cell-medium); }
    td.cell.groupcell.axis-device:not(.disabled) { background: var(--axis-cell-dark); }
    td.cell.disabled {
      background: var(--disabled-cell-bg);
      color: var(--disabled-cell-ink);
      cursor: not-allowed;
    }
    td.cell.incompatible {
      background: var(--incompatible-cell-bg);
      color: var(--incompatible-cell-ink);
      box-shadow: inset 0 0 0 1px var(--incompatible-cell-border);
    }
    td.cell.axis-hover-row {
      outline: 1px solid rgba(15, 141, 151, 0.34);
      outline-offset: -1px;
    }
    td.cell.axis-hover-col {
      outline: 1px solid rgba(15, 141, 151, 0.42);
      outline-offset: -1px;
    }
    td.cell.axis-hover-point {
      outline: 2px solid var(--point-hover);
      outline-offset: -2px;
      z-index: 2;
    }
    .matrix-cell-control:focus-visible {
      position: relative;
      z-index: 4;
      outline: 3px solid var(--point-hover);
      outline-offset: -3px;
      box-shadow: inset 0 0 0 1px var(--panel);
    }
    .matrix-cell-control {
      appearance: none;
      border: 0;
      background: transparent;
      color: inherit;
      display: block;
      width: 100%;
      height: 100%;
      min-height: var(--matrix-row-size);
      padding: 0;
      cursor: pointer;
    }
    td.cell.disabled .matrix-cell-control { cursor: not-allowed; }
    .icon-btn:focus-visible {
      outline: 3px solid var(--point-hover);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .tooltip {
      position: fixed;
      z-index: 30;
      pointer-events: none;
      background: var(--tooltip-bg);
      color: var(--tooltip-ink);
      border: 1px solid var(--tooltip-border);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.74rem;
      max-width: 400px;
      white-space: pre-wrap;
      display: none;
    }
    .conn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 16px;
      font-size: 0.66rem;
      line-height: 1;
      font-weight: 900;
      flex: 0 0 auto;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      padding: 0;
      border: 0;
      background: transparent;
      text-shadow: 0 0 0.3px currentColor;
    }
    .conn-icon.analog { color: #c43030; }
    .conn-icon.speaker { color: #d97706; }
    .conn-icon.digi { color: #2563eb; }
    .conn-icon.net { color: #0f766e; }
    .conn-icon.usb { color: #4b5563; }
    .conn-icon.tb { color: #7c3aed; }
    .conn-icon.midi { color: #db2777; }
    .conn-icon.unknown { color: var(--muted); }
    .port-with-icon {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .port-with-icon .text {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    @media (max-width: 900px) {
      .top-left, .source-head {
        min-width: 300px;
        width: 300px;
        max-width: 300px;
      }
      :root {
        --matrix-row-size: 30px;
        --matrix-col-size: 32px;
        --dest-header-size: 140px;
      }
      .dest-col-head, td.cell {
        width: var(--matrix-col-size);
        min-width: var(--matrix-col-size);
        max-width: var(--matrix-col-size);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="panel">
      <div class="toolbar">
        <div class="toolbar-fields">
          <label>Project
            <select id="projectSelect"></select>
          </label>
          <label>Device Config
            <select id="deviceConfigSelect"></select>
          </label>
          <label>Patch Config
            <select id="patchConfigSelect"></select>
          </label>
          <label>Family
            <select id="familySelect"></select>
          </label>
          <label>Patch Mode
            <select id="patchModeSelect">
              <option value="single">Single</option>
              <option value="stereo">Stereo (2)</option>
              <option value="multi">Multi</option>
              <option value="paint">Paint</option>
            </select>
          </label>
          <label>Pair Count
            <input id="pairCountInput" type="number" min="2" max="64" step="1" value="8" />
          </label>

            <input id="typeTagInput" type="text" placeholder="ST, MC8, CAT6..." />
          </label>
          <label class="toggle-field" title="When off, each endpoint can only be used once.">
            <input id="allowDoublePatchingToggle" type="checkbox" />
            Allow Double Patching
          </label>
          <label>Filter Transmitters
            <input id="sourceFilterInput" type="search" placeholder="device or port..." />
          </label>

            <input id="destFilterInput" type="search" placeholder="device or port..." />

        <div class="toolbar-actions">
          <div class="toolbar-group" aria-label="Patch history">
            <span class="toolbar-group-label">History</span>
            <button id="undoBtn" type="button" disabled aria-keyshortcuts="Control+Z Meta+Z">Undo</button>
            <button id="redoBtn" type="button" disabled aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z Control+Y">Redo</button>
          </div>
          <div class="toolbar-group">
            <span class="toolbar-group-label">Transmitters</span>
            <button id="collapseSourceBtn" type="button">Collapse</button>
            <button id="expandSourceBtn" type="button">Expand</button>
          </div>
          <div class="toolbar-group">
            <span class="toolbar-group-label">Receivers</span>
            <button id="collapseDestBtn" type="button">Collapse</button>
            <button id="expandDestBtn" type="button">Expand</button>

    <div class="matrix-wrap panel" id="matrixWrap">
      <div id="matrixContainer" style="padding:12px;color:var(--empty-ink);">Loading prototype matrix...</div>
    </div>
  </div>

  <div id="tooltip" class="tooltip"></div>
  <div id="matrixKeyboardHelp" class="sr-only">Use the arrow keys to move between routing cells. Press Space or Enter to toggle a connection or activate a folder junction.</div>
  <div id="status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <script>
    const QUERY_PARAMS = new URLSearchParams(window.location.search || "");

    function queryBoolean(name) {
      const raw = String(QUERY_PARAMS.get(name) || "").trim().toLowerCase();
      return raw === "1" || raw === "true" || raw === "yes" || raw === "on";
    }

    function withPreferredCandidate(preferred, fallbackList) {
      const out = [];
      const seen = new Set();
      for (const raw of [preferred, ...(Array.isArray(fallbackList) ? fallbackList : [])]) {
        const value = String(raw || "").trim();
        if (!value || seen.has(value)) continue;
        seen.add(value);
        out.push(value);
      }
      return out;
    }

    const PROJECT_SELECTION_STORAGE_KEY = "studioWiringProjectSelectionV1";
    const AUTO_SAVE_STORAGE_KEY = "studioWiringAutoSaveToDiskV1";
    const HAS_PROJECT_QUERY_PARAM = QUERY_PARAMS.has("project_key");
    const HAS_MODEL_QUERY_PARAM = QUERY_PARAMS.has("model");
    const HAS_CONNECTIONS_QUERY_PARAM = QUERY_PARAMS.has("connections");
    let activeModelPath = String(QUERY_PARAMS.get("model") || "").trim();
    let activeConnectionsPath = String(QUERY_PARAMS.get("connections") || "").trim();
    const STARTUP_THEME = String(QUERY_PARAMS.get("theme") || "").trim().toLowerCase();
    let themeOverrideMode = (STARTUP_THEME === "dark" || STARTUP_THEME === "light") ? STARTUP_THEME : "";
    const USE_SAVE_API = queryBoolean("use_save_api");
    const ALLOW_SOURCE_PUT = queryBoolean("allow_source_put");
    const ALLOW_DOUBLE_PATCHING_DEFAULT = queryBoolean("allow_double_patching");
    const AUTO_SAVE_CONFIGS_DEFAULT = queryBoolean("auto_save_configs");
    const MATRIX_PERF_ENABLED = queryBoolean("matrix_perf");
    const SAVE_TRANSACTION_API = String(QUERY_PARAMS.get("save_transaction_api") || "/api/save-transaction").trim()
      || "/api/save-transaction";
    let activeProjectKey = String(QUERY_PARAMS.get("project_key") || "").trim();
    let activeRoutingRulesPath = String(QUERY_PARAMS.get("routing_rules_path") || "json/routing-rules.json").trim();

    const MODEL_FALLBACK_CANDIDATES = [
      "./sandbox/prototype-lab/device-configurations/studio-model.prototype.json",
      "../projects/studio-sidecar/device-configurations/basis.json",
    ];
    const CONNECTIONS_FALLBACK_CANDIDATES = [
      "./sandbox/prototype-lab/patch-configurations/patch-default.prototype.json",
      "../projects/studio-sidecar/patch-configurations/basis/patch-default.json",
    ];
    function modelUrlCandidates() {
      return withPreferredCandidate(
        activeModelPath,
        (HAS_MODEL_QUERY_PARAM || activeModelPath) ? [] : MODEL_FALLBACK_CANDIDATES,
      );
    }
    function connectionsUrlCandidates() {
      return withPreferredCandidate(
        activeConnectionsPath,
        (HAS_CONNECTIONS_QUERY_PARAM || activeConnectionsPath) ? [] : CONNECTIONS_FALLBACK_CANDIDATES,
      );
    }
    const FAMILY_ALL = "ALL";
    const FAMILY_ORDER = ["AUDIO", "COMP", "DIGI", "NETWORK", "CONTROL"];
    const PORT_FOLDER_THRESHOLD = 8;
    const PATCH_MODE_SINGLE = "single";
    const PATCH_MODE_STEREO = "stereo";
    const PATCH_MODE_MULTI = "multi";
    const PATCH_MODE_PAINT = "paint";
    const PATCH_AUTO_SAVE_DEBOUNCE_MS = 450;

    const familySelect = document.getElementById("familySelect");
    const projectSelect = document.getElementById("projectSelect");
    const deviceConfigSelect = document.getElementById("deviceConfigSelect");
    const patchConfigSelect = document.getElementById("patchConfigSelect");
    const patchModeSelect = document.getElementById("patchModeSelect");
    const pairCountInput = document.getElementById("pairCountInput");
    const typeTagInput = document.getElementById("typeTagInput");
    const allowDoublePatchingToggle = document.getElementById("allowDoublePatchingToggle");
    const sourceFilterInput = document.getElementById("sourceFilterInput");
    const destFilterInput = document.getElementById("destFilterInput");
    const collapseSourceBtn = document.getElementById("collapseSourceBtn");
    const expandSourceBtn = document.getElementById("expandSourceBtn");
    const collapseDestBtn = document.getElementById("collapseDestBtn");
    const expandDestBtn = document.getElementById("expandDestBtn");
    const undoBtn = document.getElementById("undoBtn");
    const redoBtn = document.getElementById("redoBtn");
    const saveStateEl = document.getElementById("saveState");
    const matrixContainer = document.getElementById("matrixContainer");
    const tooltip = document.getElementById("tooltip");
    const statusEl = document.getElementById("status");
    const matrixWrapEl = document.getElementById("matrixWrap");

    let MODEL = { devices: [], families: {} };
    let connections = [];
    let projectCatalog = [];
    let applyingProjectSelection = false;
    let activeSaveTargets = {};

    let sourceFilter = "";
    let destFilter = "";
    let selectedPatchMode = PATCH_MODE_SINGLE;
    let pairCount = 8;
    let typeTagValue = "";
    let allowDoublePatching = ALLOW_DOUBLE_PATCHING_DEFAULT;
    function loadAutoSavePreference() {
      try {
        const stored = window.localStorage.getItem(AUTO_SAVE_STORAGE_KEY);
        if (stored === "1") return true;
        if (stored === "0") return false;
      } catch (_error) {
        // Ignore storage failures and use the URL default.
      }
      return null;
    }

    function persistAutoSavePreference(enabled) {
      try {
        window.localStorage.setItem(AUTO_SAVE_STORAGE_KEY, enabled ? "1" : "0");
      } catch (_error) {
        // Ignore storage failures.
      }
    }

    const storedAutoSavePreference = loadAutoSavePreference();
    let autoSaveConfigsEnabled = storedAutoSavePreference == null
      ? AUTO_SAVE_CONFIGS_DEFAULT
      : storedAutoSavePreference;
    let cableIdAllocator = new Map();
    let patchFileHandle = null;
    let patchFileName = "routing_matrix_connections.prototype.json";
    let modelSourceUrl = "";
    let patchSourceUrl = "";
    let loadedPatchVersionHash = "";
    let patchAutoSaveTimer = 0;
    let patchAutoSaveReason = "";
    let patchAutoSaveInFlight = false;
    let patchAutoSavePromise = null;
    let normalizedPortsCache = null;
    let matrixKeyboardFocusKey = "";
    const PATCH_HISTORY_LIMIT = 100;
    let patchHistory = [];
    let patchHistoryIndex = -1;
    let savedPatchFingerprint = "";
    let patchDirty = false;
    let patchSaveInProgress = false;
    let lastSaveSucceeded = false;
    let patchSaveRequestSequence = 0;
    let latestPatchSaveRequestId = 0;
    let activePatchSaveRequests = 0;
    const portsForFamilyCache = new Map();
    const compatibilityCacheByFamily = new Map();
    const connectionRowsByPair = new Map();
    const connectionRowsByEndpoint = new Map();
    const matrixPerfCounters = {
      renderRequests: 0,
      coalescedRenderRequests: 0,
      fullRenders: 0,
      renderedCells: 0,
      lastRenderCells: 0,
      lastRenderMs: 0,
      totalRenderMs: 0,
      localCellUpdates: 0,
      compatibilityComputations: 0,
      compatibilityCacheHits: 0,
      conflictCandidateChecks: 0,
    };

    window.__studioMatrixPerf = {
      counters: matrixPerfCounters,
      snapshot() {
        const renders = Number(matrixPerfCounters.fullRenders || 0);
        return {
          ...matrixPerfCounters,
          averageRenderMs: renders > 0 ? matrixPerfCounters.totalRenderMs / renders : 0,
          compatibilityCacheHitRate: (matrixPerfCounters.compatibilityCacheHits + matrixPerfCounters.compatibilityComputations) > 0
            ? matrixPerfCounters.compatibilityCacheHits / (matrixPerfCounters.compatibilityCacheHits + matrixPerfCounters.compatibilityComputations)
            : 0,
        };
      },
      reset() {
        for (const key of Object.keys(matrixPerfCounters)) matrixPerfCounters[key] = 0;
      },
    };

    const collapsedSourceDevices = new Set();
    const collapsedDestDevices = new Set();
    const collapsedSourceGroups = new Set();
    const collapsedDestGroups = new Set();
    const autoCollapsedFamilies = new Set();
    const autoCollapsedDeviceFamilies = new Set();

    function invalidatePortCaches() {
      normalizedPortsCache = null;
      portsForFamilyCache.clear();
      compatibilityCacheByFamily.clear();
    }

    function setStatus(message, warn = false) {
      if (!(statusEl instanceof HTMLElement)) return;
      statusEl.textContent = String(message || "");
      statusEl.classList.toggle("warn", Boolean(warn));
      statusEl.classList.toggle("ok", !warn && Boolean(message));
    }

    function clonePatchConnections(rows = connections) {
      return (Array.isArray(rows) ? rows : []).map((row) => ({ ...row }));
    }

    function patchFingerprint(rows = connections) {
      return JSON.stringify({ version: 1, connections: Array.isArray(rows) ? rows : [] });
    }

    function postPatchDirtyState() {
      if (!window.parent || window.parent === window) return;
      try {
        window.parent.postMessage({
          type: "studio-prototype-patch-state",
          dirty: patchDirty,
          saving: patchSaveInProgress,
          last_save_succeeded: lastSaveSucceeded,
          can_undo: patchHistoryIndex > 0,
          can_redo: patchHistoryIndex >= 0 && patchHistoryIndex < patchHistory.length - 1,
        }, "*");
      } catch (_error) {
        // Ignore cross-frame message failures.
      }
    }

    function updatePatchStateUi() {
      const canUndo = patchHistoryIndex > 0;
      const canRedo = patchHistoryIndex >= 0 && patchHistoryIndex < patchHistory.length - 1;
      if (undoBtn instanceof HTMLButtonElement) undoBtn.disabled = !canUndo;
      if (redoBtn instanceof HTMLButtonElement) redoBtn.disabled = !canRedo;
      if (saveStateEl instanceof HTMLElement) {
        const label = patchSaveInProgress ? "Saving…" : (patchDirty ? "Unsaved changes" : "Saved");
        saveStateEl.textContent = label;
        saveStateEl.classList.toggle("dirty", patchDirty && !patchSaveInProgress);
        saveStateEl.classList.toggle("saving", patchSaveInProgress);
      }
      postPatchDirtyState();
    }

    function refreshPatchDirtyState() {
      patchDirty = patchFingerprint() !== savedPatchFingerprint;
      if (patchDirty) lastSaveSucceeded = false;
      updatePatchStateUi();
    }

    function resetPatchHistory(label = "Loaded patch") {
      patchHistory = [{ label, connections: clonePatchConnections() }];
      patchHistoryIndex = 0;
      savedPatchFingerprint = patchFingerprint();
      patchDirty = false;
      lastSaveSucceeded = true;
      updatePatchStateUi();
    }

    function recordPatchHistory(label) {
      const fingerprint = patchFingerprint();
      const currentEntry = patchHistory[patchHistoryIndex];
      if (currentEntry && patchFingerprint(currentEntry.connections) === fingerprint) {
        refreshPatchDirtyState();
        return false;
      }
      if (patchHistoryIndex < patchHistory.length - 1) {
        patchHistory.splice(patchHistoryIndex + 1);
      }
      patchHistory.push({ label: String(label || "Patch change"), connections: clonePatchConnections() });
      if (patchHistory.length > PATCH_HISTORY_LIMIT) patchHistory.shift();
      patchHistoryIndex = patchHistory.length - 1;
      refreshPatchDirtyState();
      return true;
    }

    function restorePatchHistoryEntry(nextIndex, direction) {
      if (!Number.isInteger(nextIndex) || nextIndex < 0 || nextIndex >= patchHistory.length) return false;
      const priorEntry = patchHistory[patchHistoryIndex];
      const entry = patchHistory[nextIndex];
      connections = clonePatchConnections(entry.connections);
      patchHistoryIndex = nextIndex;
      cableIdAllocator = buildCableIdAllocator(connections);
      rebuildConnectionLookups();
      refreshPatchDirtyState();
      scheduleRender();
      queuePatchAutoSave(direction);
      const actionLabel = direction === "undo" ? String(priorEntry?.label || "patch change") : entry.label;
      setStatus(`${direction === "undo" ? "Undid" : "Redid"}: ${actionLabel}.`);
      return true;
    }

    function undoPatch() {
      return restorePatchHistoryEntry(patchHistoryIndex - 1, "undo");
    }

    function redoPatch() {
      return restorePatchHistoryEntry(patchHistoryIndex + 1, "redo");
    }

    function markPatchSaveStarted() {
      patchSaveRequestSequence += 1;
      const requestId = patchSaveRequestSequence;
      latestPatchSaveRequestId = requestId;
      activePatchSaveRequests += 1;
      patchSaveInProgress = activePatchSaveRequests > 0;
      lastSaveSucceeded = false;
      updatePatchStateUi();
      return requestId;
    }

    function markPatchSaveFinished(success, savedFingerprint = "", requestId = 0) {
      activePatchSaveRequests = Math.max(0, activePatchSaveRequests - 1);
      patchSaveInProgress = activePatchSaveRequests > 0;
      if (success && requestId === latestPatchSaveRequestId) {
        lastSaveSucceeded = true;
        savedPatchFingerprint = String(savedFingerprint || patchFingerprint());
      } else if (requestId === latestPatchSaveRequestId) {
        lastSaveSucceeded = false;
      }
      refreshPatchDirtyState();
    }

    function setAutoSaveConfigsEnabled(enabled, announce = false) {
      autoSaveConfigsEnabled = Boolean(enabled);
      persistAutoSavePreference(autoSaveConfigsEnabled);
      if (announce) {
        setStatus(`Auto Save Configs: ${autoSaveConfigsEnabled ? "On" : "Off"}`);
      }
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: "studio-shell-autosave-changed",
          enabled: autoSaveConfigsEnabled,
        }, "*");
      }
      if (autoSaveConfigsEnabled && patchDirty) {
        queuePatchAutoSave("auto-save-enabled");
      }
    }

    async function flushPatchAutoSave(reason = "patch-change") {
      if (patchAutoSaveTimer) {
        window.clearTimeout(patchAutoSaveTimer);
        patchAutoSaveTimer = 0;
      }
      if (!autoSaveConfigsEnabled || !patchDirty) return true;
      if (patchAutoSavePromise) {
        const priorResult = await patchAutoSavePromise;
        if (!patchDirty) return priorResult;
      }
      patchAutoSaveInFlight = true;
      const saveReason = String(reason || patchAutoSaveReason || "patch-change");
      patchAutoSaveReason = "";
      patchAutoSavePromise = savePatch(false, {
        silent: true,
        auto: true,
        reason: saveReason,
      });
      try {
        return await patchAutoSavePromise;
      } finally {
        patchAutoSavePromise = null;
        patchAutoSaveInFlight = false;
      }
    }

    function queuePatchAutoSave(reason = "patch-change") {
      if (!autoSaveConfigsEnabled) return;
      patchAutoSaveReason = String(reason || "patch-change");
      if (patchAutoSaveTimer) {
        window.clearTimeout(patchAutoSaveTimer);
      }
      patchAutoSaveTimer = window.setTimeout(() => {
        patchAutoSaveTimer = 0;
        void flushPatchAutoSave(patchAutoSaveReason || reason);
      }, PATCH_AUTO_SAVE_DEBOUNCE_MS);
    }

    let renderScheduled = false;
    function scheduleRender(_immediate = false) {
      matrixPerfCounters.renderRequests += 1;
      if (renderScheduled) {
        matrixPerfCounters.coalescedRenderRequests += 1;
        return;
      }
      renderScheduled = true;
      window.requestAnimationFrame(() => {
        renderScheduled = false;
        renderMatrix();
      });
    }

    function finishMatrixRender(startedAt, renderedCellCount) {
      const elapsed = Math.max(0, performance.now() - Number(startedAt || 0));
      matrixPerfCounters.fullRenders += 1;
      matrixPerfCounters.lastRenderCells = Math.max(0, Number(renderedCellCount || 0));
      matrixPerfCounters.renderedCells += matrixPerfCounters.lastRenderCells;
      matrixPerfCounters.lastRenderMs = elapsed;
      matrixPerfCounters.totalRenderMs += elapsed;
      if (MATRIX_PERF_ENABLED) {
        console.info(
          `[matrix perf] render ${matrixPerfCounters.fullRenders}: ${matrixPerfCounters.lastRenderCells} cells in ${elapsed.toFixed(1)} ms`,
          window.__studioMatrixPerf.snapshot()
        );
      }
    }

    function captureMatrixViewportState() {
      if (!(matrixWrapEl instanceof HTMLElement)) return null;
      return {
        top: Number(matrixWrapEl.scrollTop || 0),
        left: Number(matrixWrapEl.scrollLeft || 0),
      };
    }

    function restoreMatrixViewportState(state) {
      if (!(matrixWrapEl instanceof HTMLElement)) return;
      if (!state || typeof state !== "object") return;
      const maxTop = Math.max(0, Number(matrixWrapEl.scrollHeight || 0) - Number(matrixWrapEl.clientHeight || 0));
      const maxLeft = Math.max(0, Number(matrixWrapEl.scrollWidth || 0) - Number(matrixWrapEl.clientWidth || 0));
      const nextTop = Math.max(0, Math.min(maxTop, Number(state.top || 0)));
      const nextLeft = Math.max(0, Math.min(maxLeft, Number(state.left || 0)));
      matrixWrapEl.scrollTop = nextTop;
      matrixWrapEl.scrollLeft = nextLeft;
    }

    function matrixEntryFocusIdentity(entry) {
      if (!entry || typeof entry !== "object") return "entry:unknown";
      if (entry.kind === "port") {
        return `port:${encodeURIComponent(String(entry.port?.device || ""))}:${encodeURIComponent(String(entry.port?.port || ""))}`;
      }
      if (entry.kind === "group") {
        return `group:${encodeURIComponent(String(entry.device || ""))}:${encodeURIComponent(String(entry.typeName || ""))}`;
      }
      if (entry.kind === "device") return `device:${encodeURIComponent(String(entry.device || ""))}`;
      return `entry:${encodeURIComponent(String(entry.kind || "unknown"))}`;
    }

    function matrixCellFocusKey(sourceEntry, destEntry) {
      return `cell:${matrixEntryFocusIdentity(sourceEntry)}=>${matrixEntryFocusIdentity(destEntry)}`;
    }

    function captureMatrixFocusState() {
      const active = document.activeElement;
      if (!(active instanceof HTMLElement) || !matrixContainer?.contains(active)) return null;
      const focusTarget = active.closest("[data-matrix-focus-key]");
      if (!(focusTarget instanceof HTMLElement)) return null;
      const key = String(focusTarget.dataset.matrixFocusKey || "");
      const isCell = focusTarget.matches(".matrix-cell-control[data-matrix-focus-cell='1']");
      if (key && isCell) matrixKeyboardFocusKey = key;
      return {
        key,
        si: Number(focusTarget.dataset.si),
        di: Number(focusTarget.dataset.di),
        isCell,
      };
    }

    function elementWithMatrixFocusKey(root, key) {
      if (!(root instanceof Element) || !key) return null;
      for (const candidate of root.querySelectorAll("[data-matrix-focus-key]")) {
        if (candidate instanceof HTMLElement && candidate.dataset.matrixFocusKey === key) return candidate;
      }
      return null;
    }

    function nearestMatrixCell(cells, si, di) {
      if (!Number.isFinite(si) || !Number.isFinite(di)) return null;
      let best = null;
      let bestDistance = Number.POSITIVE_INFINITY;
      for (const cell of cells) {
        const rowDistance = Math.abs(Number(cell.dataset.si) - si);
        const colDistance = Math.abs(Number(cell.dataset.di) - di);
        const distance = rowDistance + colDistance;
        if (distance < bestDistance) {
          best = cell;
          bestDistance = distance;
        }
      }
      return best;
    }

    function configureMatrixRovingFocus(table, focusState) {
      if (!(table instanceof HTMLTableElement)) return;
      const cells = Array.from(table.querySelectorAll(".matrix-cell-control[data-matrix-focus-cell='1']"))
        .filter((cell) => cell instanceof HTMLButtonElement);
      if (!cells.length) return;

      let rovingCell = elementWithMatrixFocusKey(table, focusState?.isCell ? focusState.key : matrixKeyboardFocusKey);
      if (!(rovingCell instanceof HTMLButtonElement)) {
        rovingCell = cells.find((cell) => cell.closest("td.cell")?.classList.contains("editable") && cell.getAttribute("aria-disabled") !== "true")
          || cells.find((cell) => cell.getAttribute("role") === "button")
          || cells[0];
      }
      for (const cell of cells) cell.tabIndex = cell === rovingCell ? 0 : -1;

      if (!focusState) return;
      let restoreTarget = elementWithMatrixFocusKey(table, focusState.key);
      if (!(restoreTarget instanceof HTMLElement) && focusState.isCell) {
        restoreTarget = nearestMatrixCell(cells, focusState.si, focusState.di);
      }
      if (!(restoreTarget instanceof HTMLElement)) return;
      if (restoreTarget instanceof HTMLButtonElement) {
        for (const cell of cells) cell.tabIndex = cell === restoreTarget ? 0 : -1;
        matrixKeyboardFocusKey = String(restoreTarget.dataset.matrixFocusKey || matrixKeyboardFocusKey);
      }
      restoreTarget.focus({ preventScroll: true });
    }

    function validateMatrixAccessibility(table) {
      if (!(table instanceof HTMLTableElement)) return;
      const failures = [];
      const cells = Array.from(table.querySelectorAll(".matrix-cell-control[data-matrix-focus-cell='1']"));
      if (cells.length && cells.filter((cell) => cell.getAttribute("tabindex") === "0").length !== 1) {
        failures.push("matrix must expose exactly one cell in the tab order");
      }
      if (cells.some((cell) => !cell.getAttribute("aria-label"))) {
        failures.push("every navigable matrix cell needs an accessible label");
      }
      if (table.querySelector("td.cell.editable:not(:has(.matrix-cell-control[role='checkbox']))")) {
        failures.push("editable crosspoints need checkbox semantics");
      }
      if (table.querySelector("td.cell.groupcell[data-folder-toggle]:not([data-folder-toggle='none']):not(:has(.matrix-cell-control[role='button']))")) {
        failures.push("actionable folder junctions need button semantics");
      }
      if (failures.length) console.warn("Routing matrix accessibility assertion failed:", failures.join("; "));
    }

    const panState = {
      active: false,
      pointerId: -1,
      startX: 0,
      startY: 0,
      startLeft: 0,
      startTop: 0,
      moved: false,
      suppressClick: false,
    };

    function bindMatrixDiagonalPan() {
      if (!(matrixWrapEl instanceof HTMLElement)) return;
      if (matrixWrapEl.dataset.panBound === "1") return;
      matrixWrapEl.dataset.panBound = "1";

      matrixWrapEl.addEventListener("pointerdown", (event) => {
        const button = Number(event.button);
        const wantsPan = button === 1 || (button === 0 && event.altKey);
        if (!wantsPan) return;

        const target = event.target instanceof Element ? event.target : null;
        if (button === 0 && target && target.closest("button,input,select,textarea,a,label")) return;

        panState.active = true;
        panState.pointerId = Number(event.pointerId);
        panState.startX = Number(event.clientX || 0);
        panState.startY = Number(event.clientY || 0);
        panState.startLeft = Number(matrixWrapEl.scrollLeft || 0);
        panState.startTop = Number(matrixWrapEl.scrollTop || 0);
        panState.moved = false;

        matrixWrapEl.classList.add("matrix-panning");
        matrixWrapEl.setPointerCapture(event.pointerId);
        event.preventDefault();
      });

      matrixWrapEl.addEventListener("pointermove", (event) => {
        if (!panState.active) return;
        if (Number(event.pointerId) !== panState.pointerId) return;

        const dx = Number(event.clientX || 0) - panState.startX;
        const dy = Number(event.clientY || 0) - panState.startY;
        if (!panState.moved && (Math.abs(dx) > 2 || Math.abs(dy) > 2)) {
          panState.moved = true;
        }
        matrixWrapEl.scrollLeft = panState.startLeft - dx;
        matrixWrapEl.scrollTop = panState.startTop - dy;
        event.preventDefault();
      });

      const finishPan = (event) => {
        if (!panState.active) return;
        if (Number(event.pointerId) !== panState.pointerId) return;

        panState.active = false;
        if (panState.moved) panState.suppressClick = true;
        matrixWrapEl.classList.remove("matrix-panning");
        try {
          if (matrixWrapEl.hasPointerCapture(event.pointerId)) {
            matrixWrapEl.releasePointerCapture(event.pointerId);
          }
        } catch (error) {
          // Ignore capture release errors.
        }
      };

      matrixWrapEl.addEventListener("pointerup", finishPan);
      matrixWrapEl.addEventListener("pointercancel", finishPan);

      matrixWrapEl.addEventListener("click", (event) => {
        if (!panState.suppressClick) return;
        panState.suppressClick = false;
        event.preventDefault();
        event.stopPropagation();
      }, true);
    }

    window.addEventListener("error", (event) => {
      const message = event && event.message ? String(event.message) : "Unknown prototype error";
      const detail = event && event.filename
        ? `${message} @ ${event.filename}:${event.lineno || 0}`
        : message;
      setStatus(`Runtime error: ${detail}`, true);
      if (matrixContainer) {
        matrixContainer.innerHTML = `<div style="padding:12px;color:#fca5a5;">Runtime error: ${escHtml(detail)}</div>`;
      }
      if (matrixWrapEl) matrixWrapEl.scrollTop = 0;
    });

    function getPath(obj, path, fallback) {
      let cur = obj;
      for (const key of path) {
        if (cur == null || typeof cur !== "object" || !(key in cur)) return fallback;
        cur = cur[key];
      }
      return cur == null ? fallback : cur;
    }

    function resolveThemeModeFromModel(model) {
      const raw = String(getPath(model, ["ui_config", "theme", "mode"], "")).trim().toLowerCase();
      if (raw === "dark" || raw === "light") return raw;
      return "light";
    }

    function normalizeThemeMode(mode) {
      const token = String(mode || "").trim().toLowerCase();
      if (token === "dark" || token === "light") return token;
      return "";
    }

    function applyThemeMode(mode) {
      const resolved = normalizeThemeMode(mode) || "light";
      document.body.classList.toggle("theme-dark", resolved === "dark");
      document.body.classList.toggle("theme-light", resolved !== "dark");
    }

    function applyThemeFromModel(model) {
      const mode = themeOverrideMode || resolveThemeModeFromModel(model);
      applyThemeMode(mode);
    }

    function normalizeFamily(value) {
      const token = String(value || "").trim().toUpperCase();
      if (["AUDIO", "ANALOG", "AN"].includes(token)) return "AUDIO";
      if (["COMP", "COMPUTER", "DATA", "VIDEO", "USB", "TB4", "HDMI"].includes(token)) return "COMP";
      if (["DIGI", "DIGITAL", "MADI", "SPDIF", "ADAT", "AES"].includes(token)) return "DIGI";
      if (["NETWORK", "NET", "ETH", "ETHERNET", "RJ45", "CAT", "CAT6"].includes(token)) return "NETWORK";
      if (["CONTROL", "CTRL", "MIDI", "OSC", "DANTE"].includes(token)) return "CONTROL";
      return token;
    }

    function normalizeDirection(value, name) {
      const text = String(value || "").trim().toLowerCase();
      if (text === "in" || text === "input") return "in";
      if (text === "out" || text === "output") return "out";
      if (["io", "i/o", "inout", "in/out"].includes(text)) return "io";
      const hay = `${text} ${String(name || "").toLowerCase()}`;
      const hasIn = /\bin\b|input|return|recv|receive/.test(hay);
      const hasOut = /\bout\b|output|send|tx|transmit/.test(hay);
      if (hasIn && hasOut) return "io";
      if (hasIn) return "in";
      if (hasOut) return "out";
      return "io";
    }

    function parseBoolLike(value, fallback) {
      if (typeof value === "boolean") return value;
      if (value == null) return fallback;
      const token = String(value).trim().toLowerCase();
      if (["true", "1", "yes", "on"].includes(token)) return true;
      if (["false", "0", "no", "off"].includes(token)) return false;
      return fallback;
    }

    function compareNatural(a, b) {
      return String(a || "").localeCompare(String(b || ""), undefined, { numeric: true, sensitivity: "base" });
    }

    function inferPortTypeName(portName, explicitGroupName = "") {
      const explicit = String(explicitGroupName || "").trim();
      if (explicit) return explicit;
      let text = String(portName || "").trim();
      if (!text) return "Ports";
      text = text.replace(/\s*\([^)]*\)\s*$/g, "").trim();
      text = text.replace(/\s+\d+(?:\s*[-/]\s*\d+)?\s*$/g, "").trim();
      text = text.replace(/\s+[LR]$/i, "").trim();
      return text || "Ports";
    }

    function numberFromName(name) {
      const match = String(name || "").match(/(\d+)/);
      return match ? Number(match[1]) : Number.POSITIVE_INFINITY;
    }

    function comparePorts(a, b) {
      const ao = Number.isFinite(Number(a.order)) ? Number(a.order) : Number.POSITIVE_INFINITY;
      const bo = Number.isFinite(Number(b.order)) ? Number(b.order) : Number.POSITIVE_INFINITY;
      if (ao !== bo) return ao - bo;
      const at = compareNatural(a.type_name, b.type_name);
      if (at !== 0) return at;
      const ai = Number.isFinite(Number(a.group_index)) ? Number(a.group_index) : numberFromName(a.port);
      const bi = Number.isFinite(Number(b.group_index)) ? Number(b.group_index) : numberFromName(b.port);
      if (ai !== bi) return ai - bi;
      return compareNatural(a.port, b.port);
    }

    function normalizePorts() {
      if (Array.isArray(normalizedPortsCache)) return normalizedPortsCache;
      const devices = Array.isArray(MODEL && MODEL.devices) ? MODEL.devices : [];
      const list = [];
      for (let d = 0; d < devices.length; d += 1) {
        const rawDevice = devices[d] || {};
        const device = String(rawDevice.name || "").trim();
        if (!device) continue;
        if (parseBoolLike(rawDevice.hidden, false) || rawDevice.visible === false) continue;
        const matrixOrder = Number.isFinite(Number(rawDevice.matrix_order)) ? Number(rawDevice.matrix_order) : d;
        const rawPorts = Array.isArray(rawDevice.ports) ? rawDevice.ports : [];
        for (let p = 0; p < rawPorts.length; p += 1) {
          const port = rawPorts[p] || {};
          const portName = String(port.name || "").trim();
          if (!portName) continue;
          const visible = !parseBoolLike(port.hidden, false) && parseBoolLike(port.visible, true);
          if (!visible) continue;
          const enabled = parseBoolLike(port.enabled, true) && !parseBoolLike(port.disabled, false);
          const familiesRaw = Array.isArray(port.families) ? port.families : [];
          const families = familiesRaw.map((entry) => normalizeFamily(entry)).filter(Boolean);
          if (!families.length) continue;
          const group = port.group && typeof port.group === "object" ? port.group : {};
          list.push({
            device,
            device_order: matrixOrder,
            port: portName,
            direction: normalizeDirection(port.direction, portName),
            families,
            transport: String(port.transport || "").trim(),
            type_name: inferPortTypeName(portName, group.name),
            group_index: Number.isFinite(Number(group.index)) ? Number(group.index) : null,
            order: Number.isFinite(Number(port.order)) ? Number(port.order) : p,
            enabled,
          });
        }
      }
      normalizedPortsCache = list;
      return normalizedPortsCache;
    }

    function portsForFamily(family, sourceSide) {
      const key = `${String(family || "")}::${sourceSide ? "source" : "dest"}`;
      if (portsForFamilyCache.has(key)) return portsForFamilyCache.get(key);
      const all = normalizePorts();
      const selected = [];
      for (const port of all) {
        const supports = family === FAMILY_ALL ? port.families.length > 0 : port.families.includes(family);
        if (!supports) continue;
        if (sourceSide) {
          if (!(port.direction === "out" || port.direction === "io")) continue;
        } else {
          if (!(port.direction === "in" || port.direction === "io")) continue;
        }
        selected.push(port);
      }
      selected.sort((a, b) => {
        if (a.device_order !== b.device_order) return a.device_order - b.device_order;
        const dn = compareNatural(a.device, b.device);
        if (dn !== 0) return dn;
        return comparePorts(a, b);
      });
      portsForFamilyCache.set(key, selected);
      return selected;
    }

    function buildGroupKey(family, axis, device, typeName) {
      return `${family}::${axis}::${device}::${String(typeName || "").toLowerCase()}`;
    }

    function buildDeviceKey(family, axis, device) {
      return `${family}::${axis}::${device}`;
    }

    function buildAxisEntries(family, ports, axis, collapsedGroups, collapsedDevices) {
      const byDevice = new Map();
      for (const port of ports) {
        if (!byDevice.has(port.device)) byDevice.set(port.device, []);
        byDevice.get(port.device).push(port);
      }

      const entries = [];
      const devices = Array.from(byDevice.entries()).sort((a, b) => {
        const ao = Number((a[1] && a[1][0] && a[1][0].device_order) || 0);
        const bo = Number((b[1] && b[1][0] && b[1][0].device_order) || 0);
        if (ao !== bo) return ao - bo;
        return compareNatural(a[0], b[0]);
      });

      for (const [device, members] of devices) {
        members.sort(comparePorts);
        const deviceKey = buildDeviceKey(family, axis, device);
        const isCollapsedDevice = collapsedDevices.has(deviceKey);
        entries.push({
          kind: "device",
          axis,
          device,
          deviceKey,
          members,
          memberCount: members.length,
          collapsed: isCollapsedDevice,
        });

        if (isCollapsedDevice) continue;

        const byType = new Map();
        for (const port of members) {
          if (!byType.has(port.type_name)) byType.set(port.type_name, []);
          byType.get(port.type_name).push(port);
        }

        const typeEntries = Array.from(byType.entries()).sort((a, b) => {
          return compareNatural(a[0], b[0]);
        });
        const forceTypeFoldersForDenseDevice = members.length > 24;
        const folderEligibleTypeCount = typeEntries.reduce((count, entry) => {
          const portsOfType = Array.isArray(entry?.[1]) ? entry[1] : [];
          return count + (portsOfType.length > PORT_FOLDER_THRESHOLD ? 1 : 0);
        }, 0);
        const allowTypeFolders = forceTypeFoldersForDenseDevice || folderEligibleTypeCount > 1;

        for (const [typeName, portsOfType] of typeEntries) {
          portsOfType.sort(comparePorts);
          const groupKey = buildGroupKey(family, axis, device, typeName);
          const canShowTypeFolder = forceTypeFoldersForDenseDevice
            || (allowTypeFolders && portsOfType.length > PORT_FOLDER_THRESHOLD);
          if (canShowTypeFolder) {
            const isCollapsedGroup = collapsedGroups.has(groupKey);
            if (isCollapsedGroup) {
              entries.push({
                kind: "group",
                axis,
                device,
                deviceKey,
                groupKey,
                typeName,
                members: portsOfType,
                memberCount: portsOfType.length,
                collapsed: true,
              });
            } else {
              entries.push({
                kind: "group",
                axis,
                device,
                deviceKey,
                groupKey,
                typeName,
                members: portsOfType,
                memberCount: portsOfType.length,
                collapsed: false,
              });
              for (const port of portsOfType) {
                entries.push({
                  kind: "port",
                  axis,
                  device,
                  deviceKey,
                  groupKey,
                  typeName,
                  port,
                });
              }
            }
          } else {
            for (const port of portsOfType) {
              entries.push({
                kind: "port",
                axis,
                device,
                deviceKey,
                typeName,
                port,
              });
            }
          }
        }
      }
      return entries;
    }

    function normalizeConnection(row) {
      const source = (row && row.source) || {};
      const dest = (row && row.dest) || {};
      return {
        cable_id: String((row && row.cable_id) || "").trim(),
        family: normalizeFamily((row && row.family) || ""),
        source_device: String((row && row.source_device) || source.device || "").trim(),
        source_port: String((row && row.source_port) || source.port || "").trim(),
        dest_device: String((row && row.dest_device) || dest.device || "").trim(),
        dest_port: String((row && row.dest_port) || dest.port || "").trim(),
        connection_type: String((row && row.connection_type) || "").trim(),
        status: String((row && row.status) || "Connected").trim() || "Connected",
        notes: String((row && row.notes) || "").trim(),
        override_1to1: Boolean(row && row.override_1to1),
      };
    }

    function parseCableIdParts(cableId) {
      const match = String(cableId || "").trim().match(/^([A-Za-z]+)-?(\d+)$/);
      if (!match) return null;
      return { prefix: match[1].toUpperCase(), number: Number(match[2]), width: match[2].length };
    }

    function resequenceCableIds(rows) {
      const famOrder = new Map(FAMILY_ORDER.map((fam, idx) => [fam, idx]));
      const sorted = rows.slice().sort((a, b) => {
        const af = famOrder.has(a.family) ? famOrder.get(a.family) : 999;
        const bf = famOrder.has(b.family) ? famOrder.get(b.family) : 999;
        if (af !== bf) return af - bf;
        const sd = compareNatural(a.source_device, b.source_device);
        if (sd !== 0) return sd;
        const sp = compareNatural(a.source_port, b.source_port);
        if (sp !== 0) return sp;
        const dd = compareNatural(a.dest_device, b.dest_device);
        if (dd !== 0) return dd;
        return compareNatural(a.dest_port, b.dest_port);
      });

      const widthByPrefix = {};
      for (const row of sorted) {
        const prefix = row.family || "WIRE";
        const parts = parseCableIdParts(row.cable_id);
        const parsedWidth = parts && parts.prefix === prefix ? Number(parts.width || 0) : 0;
        widthByPrefix[prefix] = Math.max(3, Number(widthByPrefix[prefix] || 3), parsedWidth);
      }

      const nextByPrefix = {};
      for (const row of sorted) {
        const prefix = row.family || "WIRE";
        const next = Number(nextByPrefix[prefix] || 0) + 1;
        nextByPrefix[prefix] = next;
        const width = Number(widthByPrefix[prefix] || 3);
        row.cable_id = `${prefix}-${String(next).padStart(width, "0")}`;
      }
      return sorted;
    }

    function connectionKey(sourceDevice, sourcePort, destDevice, destPort) {
      return `${sourceDevice}::${sourcePort}=>${destDevice}::${destPort}`;
    }

    function addConnectionLookup(map, key, row) {
      if (!key || !row) return;
      let rows = map.get(key);
      if (!rows) {
        rows = new Set();
        map.set(key, rows);
      }
      rows.add(row);
    }

    function removeConnectionLookup(map, key, row) {
      const rows = map.get(key);
      if (!rows) return;
      rows.delete(row);
      if (!rows.size) map.delete(key);
    }

    function indexConnectionRow(row) {
      if (!row || typeof row !== "object") return;
      addConnectionLookup(
        connectionRowsByPair,
        connectionKey(row.source_device, row.source_port, row.dest_device, row.dest_port),
        row
      );
      addConnectionLookup(connectionRowsByEndpoint, endpointKey(row.source_device, row.source_port), row);
      addConnectionLookup(connectionRowsByEndpoint, endpointKey(row.dest_device, row.dest_port), row);
    }

    function unindexConnectionRow(row) {
      if (!row || typeof row !== "object") return;
      removeConnectionLookup(
        connectionRowsByPair,
        connectionKey(row.source_device, row.source_port, row.dest_device, row.dest_port),
        row
      );
      removeConnectionLookup(connectionRowsByEndpoint, endpointKey(row.source_device, row.source_port), row);
      removeConnectionLookup(connectionRowsByEndpoint, endpointKey(row.dest_device, row.dest_port), row);
    }

    function rebuildConnectionLookups() {
      connectionRowsByPair.clear();
      connectionRowsByEndpoint.clear();
      for (const row of connections) indexConnectionRow(row);
    }

    function buildCableIdAllocator(rows) {
      const state = new Map();
      const list = Array.isArray(rows) ? rows : [];
      for (const row of list) {
        const family = normalizeFamily(row?.family || "") || "WIRE";
        const parts = parseCableIdParts(row?.cable_id || "");
        const existing = state.get(family) || { next: 1, width: 3 };
        if (parts && parts.prefix === family) {
          existing.next = Math.max(existing.next, Number(parts.number || 0) + 1);
          existing.width = Math.max(existing.width, Number(parts.width || 0), 3);
        }
        state.set(family, existing);
      }
      return state;
    }

    function nextCableId(allocator, family) {
      const prefix = normalizeFamily(family || "") || "WIRE";
      const info = allocator.get(prefix) || { next: 1, width: 3 };
      const id = `${prefix}-${String(info.next).padStart(info.width, "0")}`;
      info.next += 1;
      allocator.set(prefix, info);
      return id;
    }

    function findConnectionIndex(family, sourceDevice, sourcePort, destDevice, destPort) {
      const rows = connectionRowsByPair.get(connectionKey(sourceDevice, sourcePort, destDevice, destPort));
      if (!rows) return -1;
      for (const row of rows) {
        if (family !== FAMILY_ALL && row.family !== family) continue;
        const index = connections.indexOf(row);
        if (index >= 0) return index;
      }
      return -1;
    }

    function connectionRowForPair(family, sourceDevice, sourcePort, destDevice, destPort) {
      const rows = connectionRowsByPair.get(connectionKey(sourceDevice, sourcePort, destDevice, destPort));
      if (!rows) return null;
      for (const row of rows) {
        if (family === FAMILY_ALL || row.family === family) return row;
      }
      return null;
    }

    function endpointKey(device, port) {
      return `${String(device || "")}::${String(port || "")}`;
    }

    function findStrictConflict(sourceDevice, sourcePort, destDevice, destPort, excludingPairKey = "") {
      const endpointKeys = [
        endpointKey(sourceDevice, sourcePort),
        endpointKey(destDevice, destPort),
      ];
      const skipPairKey = String(excludingPairKey || "");
      const visited = new Set();
      for (const key of endpointKeys) {
        const candidates = connectionRowsByEndpoint.get(key);
        if (!candidates) continue;
        for (const row of candidates) {
          if (visited.has(row)) continue;
          visited.add(row);
          matrixPerfCounters.conflictCandidateChecks += 1;
          const rowPairKey = connectionKey(row.source_device, row.source_port, row.dest_device, row.dest_port);
          if (skipPairKey && rowPairKey === skipPairKey) continue;
          return row;
        }
      }
      return null;
    }

    function allowDoublePatchingEnabled() {
      if (allowDoublePatchingToggle instanceof HTMLInputElement) {
        return Boolean(allowDoublePatchingToggle.checked);
      }
      return Boolean(allowDoublePatching);
    }

    function sharedFamilies(sourcePort, destPort) {
      const src = Array.isArray(sourcePort && sourcePort.families) ? sourcePort.families : [];
      const dst = Array.isArray(destPort && destPort.families) ? destPort.families : [];
      return FAMILY_ORDER.filter((fam) => src.includes(fam) && dst.includes(fam));
    }

    function computeLinkCompatibility(selectedFamily, sourcePort, destPort) {
      const shared = sharedFamilies(sourcePort, destPort);
      if (!shared.length) return { family: "", reason: "Incompatible port families" };
      const candidates = selectedFamily === FAMILY_ALL
        ? shared
        : (shared.includes(selectedFamily) ? [selectedFamily] : []);
      if (!candidates.length) return { family: "", reason: `No shared family for ${selectedFamily}` };
      for (const family of candidates) {
        if (supportsTransportCompatibilityForFamily(family, sourcePort, destPort)) {
          return { family, reason: "" };
        }
      }
      if (candidates.includes("AUDIO") && isSpeakerToAnalogPair(sourcePort, destPort)) {
        return { family: "", reason: "Speaker to analog connection is not allowed" };
      }
      if (candidates.includes("CONTROL")) {
        const sourceProtocol = controlProtocolForPort(sourcePort) || "?";
        const destProtocol = controlProtocolForPort(destPort) || "?";
        return { family: "", reason: `CONTROL transport mismatch: ${sourceProtocol} -> ${destProtocol}` };
      }
      return { family: "", reason: "Unavailable connection" };
    }

    function linkCompatibility(selectedFamily, sourcePort, destPort) {
      const familyKey = String(selectedFamily || "");
      let sourceCache = compatibilityCacheByFamily.get(familyKey);
      if (!sourceCache) {
        sourceCache = new WeakMap();
        compatibilityCacheByFamily.set(familyKey, sourceCache);
      }
      let destCache = sourceCache.get(sourcePort);
      if (!destCache) {
        destCache = new WeakMap();
        sourceCache.set(sourcePort, destCache);
      }
      const cached = destCache.get(destPort);
      if (cached) {
        matrixPerfCounters.compatibilityCacheHits += 1;
        return cached;
      }
      const computed = computeLinkCompatibility(familyKey, sourcePort, destPort);
      destCache.set(destPort, computed);
      matrixPerfCounters.compatibilityComputations += 1;
      return computed;
    }

    function linkCompatibilityReason(selectedFamily, sourcePort, destPort) {
      return linkCompatibility(selectedFamily, sourcePort, destPort).reason;
    }

    function resolveLinkFamily(selectedFamily, sourcePort, destPort) {
      return linkCompatibility(selectedFamily, sourcePort, destPort).family;
    }

    function crosspointPresentation(family, sourcePort, destPort, connection) {
      const compatibility = linkCompatibility(family, sourcePort, destPort);
      const connected = Boolean(connection);
      const enabled = Boolean(sourcePort?.enabled) && Boolean(destPort?.enabled);
      const title = connected
        ? `${connection.cable_id || "(auto)"}: ${sourcePort.port} -> ${destPort.port}`
        : ((!enabled)
          ? "Disabled port"
          : (compatibility.family
            ? `${selectedPatchMode === PATCH_MODE_PAINT ? "Drag to paint diagonally from first point" : "Click to connect"} (${compatibility.family})`
            : compatibility.reason));
      const connectionState = connected
        ? `Connected${connection.cable_id ? ` with cable ${connection.cable_id}` : ""}. Press Space or Enter to disconnect using ${selectedPatchMode} mode.`
        : ((!enabled)
          ? "Not connected. Unavailable because one or both ports are disabled."
          : (compatibility.family
            ? (selectedPatchMode === PATCH_MODE_PAINT
              ? `Not connected. Press Space or Enter to toggle this crosspoint, or drag with a pointer to paint diagonally. Compatible ${compatibility.family} connection.`
              : `Not connected. Press Space or Enter to connect using ${selectedPatchMode} mode. Compatible ${compatibility.family} connection.`)
            : `Not connected. Incompatible: ${compatibility.reason || "these ports cannot be connected"}.`));
      return { connected, enabled, compatibility, title, connectionState };
    }

    function guessTypeTag(family) {
      if (family === "AUDIO") return "MONO";
      if (family === "NETWORK") return "CAT6";
      if (family === "CONTROL") return "MIDI";
      return "";
    }

    function resolveConnectionTag(family) {
      const typed = String(typeTagValue || "").trim();
      if (typed) return typed;
      return guessTypeTag(family);
    }

    function normalizePatchMode(value) {
      const token = String(value || "").trim().toLowerCase();
      if ([PATCH_MODE_SINGLE, PATCH_MODE_STEREO, PATCH_MODE_MULTI, PATCH_MODE_PAINT].includes(token)) return token;
      return PATCH_MODE_SINGLE;
    }

    function normalizePairCount(value) {
      const numeric = Math.floor(Number(value));
      if (!Number.isFinite(numeric)) return 8;
      return Math.max(2, Math.min(64, numeric));
    }

    function patchSpan() {
      if (selectedPatchMode === PATCH_MODE_STEREO) return 2;
      if (selectedPatchMode === PATCH_MODE_MULTI) return pairCount;
      return 1;
    }

    function eventClosest(event, selector) {
      const target = event && event.target;
      if (target instanceof Element) return target.closest(selector);
      if (target && target.parentElement instanceof Element) return target.parentElement.closest(selector);
      return null;
    }

    function iconForPort(port) {
      const transport = String(port?.transport || "").trim().toUpperCase();
      const portName = String(port?.port || "").trim().toUpperCase();
      const families = Array.isArray(port?.families) ? port.families : [];
      if (/THUNDERBOLT|(^|[^A-Z])TB(4)?([^A-Z]|$)/.test(transport)) return { label: "TBT", cls: "tb", title: transport || "Thunderbolt" };
      if (/USB/.test(transport)) return { label: "USB", cls: "usb", title: transport || "USB" };
      if (/MIDI/.test(transport) || /MIDI/.test(portName)) return { label: "MID", cls: "midi", title: transport || "MIDI" };
      if (/CAT|RJ45|ETH|NETWORK/.test(transport) || /ETH|NETWORK|RJ45|CAT/.test(portName)) return { label: "NET", cls: "net", title: transport || "Network" };
      if (/SPK|SPEAKER/.test(transport) || /SPK|SPEAKER/.test(portName)) return { label: "SPK", cls: "speaker", title: transport || "Speaker" };
      if (/MADI|SPDIF|S\/PDIF|ADAT|AES|OPT|HDMI/.test(transport)) return { label: "DIG", cls: "digi", title: transport || "Digital" };
      if (/(^|[^A-Z])(XLR|TRS|TS|RCA|JACK)([^A-Z]|$)/.test(transport)) return { label: "ANA", cls: "analog", title: transport || "Analog" };
      if (/LINE|MIC|MON|AUX|GROUP|INSERT|TAPE|HEADPHONE|HP/.test(portName)) return { label: "ANA", cls: "analog", title: "Analog" };
      if (families.includes("AUDIO")) return { label: "ANA", cls: "analog", title: "Analog" };
      if (families.includes("DIGI")) return { label: "DIG", cls: "digi", title: "Digital" };
      if (families.includes("NETWORK")) return { label: "NET", cls: "net", title: "Network" };
      if (families.includes("COMP")) return { label: "USB", cls: "usb", title: "Computer/Data" };
      return { label: "?", cls: "unknown", title: transport || "Connector" };
    }

    function isSpeakerToAnalogPair(sourcePort, destPort) {
      const sourceClass = String(iconForPort(sourcePort)?.cls || "");
      const destClass = String(iconForPort(destPort)?.cls || "");
      return (sourceClass === "speaker" && destClass === "analog")
        || (sourceClass === "analog" && destClass === "speaker");
    }

    function controlProtocolForPort(port) {
      const transport = String(port?.transport || "").trim().toUpperCase();
      const portName = String(port?.port || "").trim().toUpperCase();
      if (/MIDI/.test(transport) || /MIDI/.test(portName)) return "MIDI";
      if (/OSC/.test(transport) || /OSC/.test(portName)) return "OSC";
      if (/DANTE/.test(transport) || /DANTE/.test(portName)) return "DANTE";
      return "";
    }

    function supportsTransportCompatibilityForFamily(family, sourcePort, destPort) {
      const normalized = normalizeFamily(family);
      if (normalized === "AUDIO") {
        return !isSpeakerToAnalogPair(sourcePort, destPort);
      }
      if (normalized === "CONTROL") {
        const sourceProtocol = controlProtocolForPort(sourcePort);
        const destProtocol = controlProtocolForPort(destPort);
        if (!sourceProtocol || !destProtocol) return false;
        return sourceProtocol === destProtocol;
      }
      return true;
    }

    function iconHtmlForPort(port) {
      const icon = iconForPort(port);
      return `<span class="conn-icon ${escAttr(icon.cls)}" title="${escAttr(icon.title)}">${escHtml(icon.label)}</span>`;
    }

    function isEntryVisible(entry, query) {
      if (!query) return true;
      const q = String(query || "").trim().toLowerCase();
      if (!q) return true;
      const texts = [];
      if (entry.kind === "port") {
        texts.push(entry.device, entry.port.port, entry.typeName || "");
      } else {
        texts.push(entry.device, entry.typeName || "");
      }
      return texts.some((text) => String(text || "").toLowerCase().includes(q));
    }

    function collectMembers(entry) {
      if (!entry) return [];
      if (entry.kind === "port") return [entry.port];
      if (Array.isArray(entry.members)) return entry.members;
      return [];
    }

    function alignedMemberPairs(entryA, entryB) {
      const srcMembers = collectMembers(entryA);
      const dstMembers = collectMembers(entryB);
      const span = Math.min(srcMembers.length, dstMembers.length);
      const pairs = [];
      for (let i = 0; i < span; i += 1) {
        const src = srcMembers[i];
        const dst = dstMembers[i];
        if (!src || !dst) continue;
        pairs.push([src, dst]);
      }
      return pairs;
    }

    // Single source of truth for +/- symbols on header toggles.
    function toggleMetaForEntry(entry) {
      const kind = String(entry?.kind || "");
      if (kind !== "device" && kind !== "group") {
        return { enabled: false, symbol: "", title: "" };
      }
      const collapsed = Boolean(entry?.collapsed);
      const noun = kind === "device" ? "device" : "group";
      return {
        enabled: true,
        collapsed,
        symbol: collapsed ? "+" : "−",
        title: `${collapsed ? "Expand" : "Collapse"} ${noun}`,
      };
    }

    // Single source of truth for +/- symbols on folder intersection cells.
    function folderCellToggleMeta(family, sourceEntry, destEntry) {
      const sourceFolder = Boolean(sourceEntry && sourceEntry.kind !== "port");
      const destFolder = Boolean(destEntry && destEntry.kind !== "port");
      const canToggle = sourceFolder && destFolder;
      if (!canToggle) {
        return {
          sourceFolder,
          destFolder,
          canToggle: false,
          action: "none",
          symbol: "",
          hover: "Folder toggle appears only on folder junctions.",
        };
      }
      const sourceCollapsed = isEntryCollapsedOnAxis(family, "source", sourceEntry);
      const destCollapsed = isEntryCollapsedOnAxis(family, "dest", destEntry);
      const action = (sourceCollapsed && destCollapsed) ? "expand" : "collapse";
      return {
        sourceFolder,
        destFolder,
        canToggle: true,
        targetAxis: "both",
        action,
        symbol: action === "expand" ? "+" : "−",
        hover: `${action === "expand" ? "Expand" : "Collapse"} source + destination folders.`,
      };
    }

    function setDeviceCollapsedOnAxis(family, axis, deviceName, collapsed) {
      if (!deviceName) return false;
      const primarySet = axis === "dest" ? collapsedDestDevices : collapsedSourceDevices;
      const primaryKey = buildDeviceKey(family, axis, deviceName);
      if (collapsed) {
        primarySet.add(primaryKey);
      } else {
        primarySet.delete(primaryKey);
      }
      return true;
    }

    function setGroupCollapsedOnAxis(family, axis, deviceName, typeName, collapsed) {
      if (!deviceName || !typeName) return false;
      const primarySet = axis === "dest" ? collapsedDestGroups : collapsedSourceGroups;
      const primaryKey = buildGroupKey(family, axis, deviceName, typeName);
      if (collapsed) {
        primarySet.add(primaryKey);
      } else {
        primarySet.delete(primaryKey);
      }
      return true;
    }

    function setEntryCollapsedOnAxis(family, axis, entry, collapsed) {
      if (!entry) return false;
      if (entry.kind === "device") {
        return setDeviceCollapsedOnAxis(family, axis, String(entry.device || ""), collapsed);
      }
      if (entry.kind === "group") {
        return setGroupCollapsedOnAxis(family, axis, String(entry.device || ""), String(entry.typeName || ""), collapsed);
      }
      return false;
    }

    function isEntryCollapsedOnAxis(family, axis, entry) {
      if (!entry) return false;
      if (entry.kind === "device") {
        const key = buildDeviceKey(family, axis, String(entry.device || ""));
        const setRef = axis === "dest" ? collapsedDestDevices : collapsedSourceDevices;
        return setRef.has(key);
      }
      if (entry.kind === "group") {
        const key = buildGroupKey(family, axis, String(entry.device || ""), String(entry.typeName || ""));
        const setRef = axis === "dest" ? collapsedDestGroups : collapsedSourceGroups;
        return setRef.has(key);
      }
      return false;
    }

    function toggleHeaderEntryOnAxis(family, axis, entry) {
      if (!entry || (entry.kind !== "device" && entry.kind !== "group")) {
